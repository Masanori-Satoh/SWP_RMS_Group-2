# =========================================================================
# FILE CẤU HÌNH GỐC (Được đẩy lên Git)
# Chứa các cấu hình mặc định của hệ thống. KHÔNG ĐIỀN MẬT KHẨU VÀO ĐÂY!
# Mọi mật khẩu vui lòng cấu hình bên file application-local.properties
# =========================================================================

# Tự động nạp file application-local.properties nếu có
spring.profiles.active=local

spring.application.name=SWP_RMS_Group-2

# ======================== DATABASE (MS SQL SERVER) ========================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=RitirementManagement2;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ======================== JPA / HIBERNATE ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# ======================== SERVER ========================
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ======================== FILE UPLOAD (CV ỨNG TUYỂN) ========================
# Tầng servlet nhận tối đa 10MB; giới hạn nghiệp vụ 5MB nằm ở CvFileValidator để lỗi hiện cạnh ô.
# File vượt giới hạn servlet làm mất token CSRF trong form, người dùng sẽ thấy trang 403.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
# Thư mục lưu CV khi chạy local (ngoài static/, đã gitignore)
app.storage.local-root=uploads

# ======================== THYMELEAF ========================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ======================== GMAIL SMTP (MẶC ĐỊNH) ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ======================== CUSTOM APP PROPERTIES ========================
app.public.base.url=http://localhost:8081

# ======================== LOGGING & DEVTOOLS ========================
logging.level.com.group2.rms=DEBUG
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/resources/templates,src/main/resources/static
