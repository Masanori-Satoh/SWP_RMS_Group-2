spring:
  application:
    name: SWP_RMS_Group-2

  # ==================== MS SQL SERVER ====================
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=RMS_DB;encrypt=true;trustServerCertificate=true
    username: sa
    password: 123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # ==================== JPA / HIBERNATE ====================
  jpa:
    hibernate:
      # update: Hibernate tự động tạo/cập nhật bảng theo Entity (phù hợp dev)
      # validate: Chỉ kiểm tra schema khớp, KHÔNG tạo bảng (dùng khi production)
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
        # Tắt open-session-in-view để tránh lazy loading ngoài transaction
    open-in-view: false

  # ==================== THYMELEAF ====================
  thymeleaf:
    cache: false          # Tắt cache khi dev để thấy ngay thay đổi HTML
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html

  # ==================== SPRING MVC ====================
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss

# ==================== SERVER ====================
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true

# ==================== LOGGING ====================
logging:
  level:
    com.group2.rms: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
