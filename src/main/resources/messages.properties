# 2. Jakarta Validation Default Messages
NotNull=Trường này không được để trống.
NotBlank=Trường này không được để trống.
NotEmpty=Trường này không được để trống.
Positive=Giá trị phải lớn hơn 0.
PositiveOrZero=Giá trị không được nhỏ hơn 0.
Future=Ngày được chọn phải sau ngày hiện tại.
FutureOrPresent=Ngày được chọn không được ở trong quá khứ.
Past=Ngày được chọn phải ở trong quá khứ.
Min=Giá trị không được nhỏ hơn {value}.
Max=Giá trị không được vượt quá {value}.
Size=Độ dài phải từ {min} đến {max} ký tự.
