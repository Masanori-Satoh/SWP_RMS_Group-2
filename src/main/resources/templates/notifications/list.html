<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: interfaceHead('Thông báo hệ thống', ~{::pageStyles})}">
    <th:block th:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/notifications.css}">
    </th:block>
</head>

<body class="rms-app notif-page">
    <div class="page-wrapper">
        <aside th:replace="~{fragments/sidebar :: workspace('notifications', ${viewerRole})}"></aside>
        <div class="main-content">
            <header th:replace="~{fragments/workspace-header :: header(${viewerRole}, ${viewerName})}"></header>
            <main id="main" tabindex="-1" class="page-content">
                <div class="container notif-container">
                    <nav class="requisition-breadcrumb" aria-label="Điều hướng">
                        <a th:href="@{/dashboard}">Bảng điều khiển</a>
                        <span aria-hidden="true">/</span>
                        <span aria-current="page">Thông báo</span>
                    </nav>

                    <div class="notif-page-header">
                        <div>
                            <h1>Thông báo hệ thống</h1>
                            <p class="notif-subtitle" th:text="|Bạn có ${unreadCount} thông báo chưa đọc|"></p>
                        </div>
                        <div class="notif-actions" th:if="${unreadCount > 0}">
                            <form th:action="@{/notifications/read-all}" method="post">
                                <button type="submit" class="btn-read-all">
                                    <i class="bi bi-check2-all"></i> Đánh dấu tất cả là đã đọc
                                </button>
                            </form>
                        </div>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}" style="margin-bottom: 1rem; padding: 0.75rem 1rem; background-color: #ecfdf5; border: 1px solid #6ee7b7; border-radius: 6px; color: #065f46;"></div>

                    <div class="notif-list" th:if="${not #lists.isEmpty(notifications)}">
                        <div th:each="n : ${notifications}" class="notif-card" th:classappend="${n.isRead ? 'read' : 'unread'}">
                            <div class="notif-card-header">
                                <div class="notif-badge-group">
                                    <span class="notif-badge" th:classappend="${n.isRead ? 'status-read' : 'status-unread'}" th:text="${n.isRead ? 'Đã đọc' : 'Mới'}"></span>
                                    <span th:if="${n.eventType == 'REQUISITION_REJECTED'}" class="notif-badge event-rejected">Yêu cầu bị từ chối</span>
                                    <span th:if="${n.eventType == 'JOB_POSTING_PUBLISHED'}" class="notif-badge" style="background:#dcfce7; color:#15803d;">Tin đã phát hành</span>
                                </div>
                                <span class="notif-time" th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                            </div>

                            <h3 class="notif-title" th:text="${n.title}"></h3>
                            <div class="notif-content" th:text="${n.content}"></div>

                            <div class="notif-footer">
                                <form th:if="${!n.isRead}" th:action="@{'/notifications/' + ${n.notificationId} + '/read'}" method="post" style="display: inline;">
                                    <button type="submit" class="btn-mark-read">Đánh dấu đã đọc</button>
                                </form>
                                <form th:if="${n.linkUrl != null}" th:action="@{'/notifications/' + ${n.notificationId} + '/read'}" method="post" style="display: inline;">
                                    <input type="hidden" name="redirectUrl" th:value="${n.linkUrl}">
                                    <button type="submit" class="btn-open-target">
                                        Xem chi tiết <i class="bi bi-arrow-right"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="notif-empty" th:if="${#lists.isEmpty(notifications)}">
                        <div class="notif-empty-icon"><i class="bi bi-bell-slash"></i></div>
                        <h3>Chưa có thông báo nào</h3>
                        <p>Khi có cập nhật về yêu cầu tuyển dụng hoặc tin tuyển dụng liên quan, thông báo sẽ hiển thị tại đây.</p>
                    </div>

                    <div th:if="${totalPages > 1}" style="margin-top: 1.5rem; display: flex; justify-content: center; gap: 0.5rem;">
                        <a th:if="${currentPage > 1}" th:href="@{/notifications(page=${currentPage - 1})}" class="btn btn-secondary">Trước</a>
                        <span style="padding: 0.5rem 1rem; align-self: center;" th:text="|Trang ${currentPage} / ${totalPages}|"></span>
                        <a th:if="${currentPage < totalPages}" th:href="@{/notifications(page=${currentPage + 1})}" class="btn btn-secondary">Sau</a>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
