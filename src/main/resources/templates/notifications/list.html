<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/internal}">
<head>
    <title>Thông báo</title>
    <th:block layout:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/notifications.css}">
    </th:block>
</head>
<body>
<main id="main" layout:fragment="content" class="container notif-container" tabindex="-1">
    <nav class="requisition-breadcrumb" aria-label="Breadcrumb">
        <a th:href="@{/dashboard}">Bảng điều khiển</a>
        <span aria-hidden="true">/</span>
        <span aria-current="page">Thông báo</span>
    </nav>

    <div class="notif-page-header">
        <div>
            <h1>Thông báo</h1>
            <p class="notif-subtitle" th:text="|Bạn có ${unreadCount} thông báo chưa đọc|"></p>
        </div>
        <div class="notif-actions" th:if="${unreadCount > 0}">
            <form th:action="@{/notifications/read-all}" method="post">
                <button type="submit" class="btn btn--secondary btn--sm btn-read-all">
                    Đánh dấu tất cả đã đọc
                </button>
            </form>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert--success" th:text="${successMessage}"></div>

    <div class="notif-list" th:if="${not #lists.isEmpty(notifications)}">
        <div th:each="n : ${notifications}" class="notif-card card" th:classappend="${n.isRead ? 'read' : 'unread'}">
            <div class="notif-card-header">
                <div class="notif-badge-group">
                    <span class="badge" th:classappend="${n.isRead ? 'badge--neutral status-read' : 'badge--warning status-unread'}" th:text="${n.isRead ? 'Đã đọc' : 'Mới'}"></span>
                    <span th:if="${n.eventType == 'REQUISITION_REJECTED'}" class="badge badge--danger event-rejected">Yêu cầu bị từ chối</span>
                    <span th:if="${n.eventType == 'JOB_POSTING_PUBLISHED'}" class="badge badge--success event-published">Tin tuyển dụng đã phát hành</span>
                </div>
                <span class="notif-time text-muted" th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
            </div>

            <h3 class="notif-title" th:text="${n.title}"></h3>
            <div class="notif-content" th:text="${n.content}"></div>

            <div class="notif-footer">
                <form th:if="${!n.isRead}" th:action="@{'/notifications/' + ${n.notificationId} + '/read'}" method="post">
                    <button type="submit" class="btn btn--outline btn--sm btn-mark-read">Đánh dấu đã đọc</button>
                </form>
                <form th:if="${n.linkUrl != null}" th:action="@{'/notifications/' + ${n.notificationId} + '/read'}" method="post">
                    <input type="hidden" name="redirectUrl" th:value="${n.linkUrl}">
                    <button type="submit" class="btn btn--primary btn--sm btn-open-target">
                        Xem chi tiết &rarr;
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" th:if="${#lists.isEmpty(notifications)}">
        <p class="empty-title">Không có thông báo nào</p>
        <p class="empty-desc">Bạn đã xem hết toàn bộ các cập nhật hệ thống.</p>
    </div>
</main>
</body>
</html>
