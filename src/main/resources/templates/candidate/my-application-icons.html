<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
    CANDIDATE/MY-APPLICATION-ICONS.HTML — icon nét mảnh cho "Đơn của tôi" (candidate/my-applications.html,
    candidate/my-application-detail.html, candidate/my-application-parts.html).
    Cùng kiểu với sidebar và jobCard: viewBox 24, stroke 2, màu theo chữ (currentColor). Cỡ do CSS (.myapp-icon).
    Cách gọi: <svg th:replace="~{candidate/my-application-icons :: icon('calendar')}"></svg>
    Tên: file (CV), calendar, mail, search, withdraw, check, close, back.
-->
<svg th:fragment="icon(name)" class="myapp-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
     focusable="false">
    <th:block th:switch="${name}">
        <th:block th:case="'file'">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
        </th:block>
        <th:block th:case="'calendar'">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
        </th:block>
        <th:block th:case="'mail'">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <polyline points="22 6 12 13 2 6"/>
        </th:block>
        <th:block th:case="'search'">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </th:block>
        <th:block th:case="'withdraw'">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
            <polyline points="3 3 3 8 8 8"/>
        </th:block>
        <th:block th:case="'check'">
            <polyline points="20 6 9 17 4 12"/>
        </th:block>
        <th:block th:case="'close'">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
        </th:block>
        <th:block th:case="'back'">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </th:block>
    </th:block>
</svg>
</body>
</html>
