<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!-- Kế thừa fragment head từ file head.html đã tạo trước đó -->
<head th:replace="~{fragments/head :: head(title='Hello World')}"></head>
<body>
    <div class="page-wrapper">
        <!-- Sidebar placeholder -->
        <aside class="sidebar">
            <div style="padding: 20px; color: white; font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.1);">
                RMS Group-2
            </div>
            <div style="padding: 20px; color: var(--color-text-muted);">
                <div class="mb-4"><i class="bi bi-house-door me-2"></i> Dashboard</div>
                <div class="mb-4"><i class="bi bi-people me-2"></i> Ứng viên</div>
                <div class="mb-4"><i class="bi bi-briefcase me-2"></i> Công việc</div>
            </div>
        </aside>

        <main class="main-content">
            <!-- Topbar placeholder -->
            <header class="topbar">
                <div class="fw-bold">Hệ thống Quản lý Tuyển dụng (RMS)</div>
                <div class="d-flex align-center gap-2">
                    <div class="badge badge-success">Online</div>
                    <div class="fw-semi text-primary">Admin</div>
                </div>
            </header>

            <!-- Main Page Content -->
            <div class="page-content">
                <div class="container">
                    <div class="card" style="margin-top: 2rem; max-width: 600px; margin-left: auto; margin-right: auto; text-align: center;">
                        <div class="card-header" style="color: var(--color-primary); border-bottom: none;">
                            <i class="bi bi-stack" style="font-size: 2rem; display: block; margin-bottom: 10px;"></i>
                            Test Web / Thông số kỹ thuật
                        </div>
                        <div style="padding: 1rem 0; text-align: left; max-width: 400px; margin: 0 auto;">
                            <h4 style="text-align: center; margin-bottom: 1.5rem;" th:text="${message}">Message</h4>
                            
                            <ul style="list-style: none; padding: 0;">
                                <li class="mb-2"><i class="bi bi-check-circle-fill text-success me-2"></i> <strong>Java Version:</strong> JDK 21 (LTS)</li>
                                <li class="mb-2"><i class="bi bi-check-circle-fill text-success me-2"></i> <strong>Framework:</strong> Spring Boot 3.5.16</li>
                                <li class="mb-2"><i class="bi bi-check-circle-fill text-success me-2"></i> <strong>View Engine:</strong> Thymeleaf</li>
                                <li class="mb-2"><i class="bi bi-check-circle-fill text-success me-2"></i> <strong>Database:</strong> MS SQL Server (JDBC)</li>
                                <li class="mb-2"><i class="bi bi-check-circle-fill text-success me-2"></i> <strong>ORM:</strong> Spring Data JPA / Hibernate</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
