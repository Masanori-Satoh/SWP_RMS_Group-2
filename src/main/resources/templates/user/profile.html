<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/internal}">
<!--
    USER/PROFILE.HTML — Hồ sơ cá nhân của người dùng nội bộ (/profile). Ứng viên dùng /portal/profile (candidate/my-profile.html).
    Khung (sidebar, topbar, CSRF meta) do layout/internal lo.
    CSS: css/profile.css (profile-).
-->
<head>
    <title>Hồ sơ cá nhân</title>
    <th:block layout:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/profile.css}">
    </th:block>
</head>
<body>
<main id="main" layout:fragment="content" class="page-content container adw-page profile-page" tabindex="-1">
    <div class="alert alert--danger alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <th:block th:replace="~{fragments/ui/admin-workspace :: scene}"></th:block>
    <div class="profile-shell">
    <div class="page-header adw-heading">
        <h1 class="page-title adw-title">Hồ sơ cá nhân</h1>
    </div>

    <!-- Thông báo lưu thành công -->
    <div class="alert alert--success alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="profile-layout">
        <!-- Cột trái: một thẻ tổng quan (ảnh, tên, vai trò, mật khẩu) -->
        <section class="card profile-card profile-overview adw-surface" aria-labelledby="overview-name">
            <!-- Bấm vào ảnh để chọn file; tự động gửi form khi chọn xong (JPEG/PNG/WebP ≤ 2 MB) -->
            <form class="profile-avatar-form" th:action="@{/profile/avatar}" method="post"
                  enctype="multipart/form-data">
                <label class="profile-avatar-picker" for="avatar-file" title="Bấm để chọn ảnh đại diện">
                    <img class="profile-avatar" th:if="${userProfile.avatarUrl != null}"
                         th:src="${userProfile.avatarUrl}" alt="Ảnh đại diện">
                    <span class="profile-avatar profile-avatar-fallback" th:unless="${userProfile.avatarUrl != null}"
                          aria-hidden="true" th:text="${#strings.toUpperCase(#strings.substring(userProfile.fullName, 0, 1))}">A</span>
                    <span class="profile-avatar-overlay" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    </span>
                    <span class="sr-only">Đổi ảnh đại diện</span>
                </label>
                <input class="sr-only" id="avatar-file" name="avatarFile" type="file"
                       accept="image/jpeg,image/png,image/webp" required
                       onchange="this.form.submit()"
                       th:attr="aria-invalid=${avatarError != null}" aria-describedby="avatar-file-hint avatar-file-error">
                <small id="avatar-file-hint" class="form-hint">JPEG, PNG hoặc WebP, tối đa 2 MB.</small>
                <span id="avatar-file-error" class="form-error" role="alert"
                      th:text="${avatarError}" th:if="${avatarError != null}"></span>
            </form>

            <div class="profile-identity">
                <p id="overview-name" class="profile-identity-name" th:text="${userProfile.fullName}">Họ và tên</p>
                <span class="badge badge--neutral" th:text="${userProfile.roleLabel}">Vai trò</span>
            </div>

            <!-- Mật khẩu: nút mở hộp thoại -->
            <div class="profile-security">
                <div>
                    <h2 class="profile-security-title">Mật khẩu</h2>
                    <p aria-label="Mật khẩu đã ẩn">••••••••</p>
                </div>
                <button class="btn btn--outline btn-outline" type="button" onclick="document.getElementById('changePasswordModal').showModal()">Đổi mật khẩu</button>
            </div>
        </section>

        <!-- Cột phải: thông tin chi tiết -->
        <section class="card profile-card adw-surface" aria-labelledby="general-title">
            <div class="profile-card-head">
                <h2 id="general-title">Thông tin hồ sơ</h2>
                <div class="profile-card-actions">
                    <button class="btn btn--primary btn-primary" id="btnSaveProfile" type="submit" form="profileForm">Lưu thay đổi</button>
                </div>
            </div>

            <form id="profileForm" th:action="@{/profile/update}" th:object="${updateRequest}" method="post">
                <div th:replace="~{fragments/messages :: validationSummary}"></div>

                <h3 class="profile-section-title">Tài khoản &amp; hệ thống</h3>
                <div class="profile-grid">
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control profile-readonly" id="email" type="email"
                               th:value="${userProfile.email}" disabled>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="username">Tên đăng nhập</label>
                        <input class="form-control profile-readonly" id="username" type="text"
                               th:value="${userProfile.username}" disabled>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="role">Vai trò</label>
                        <input class="form-control profile-readonly" id="role" type="text"
                               th:value="${userProfile.roleLabel}" disabled>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="department">Phòng ban</label>
                        <input class="form-control profile-readonly" id="department" type="text"
                               th:value="${userProfile.departmentName}" disabled>
                    </div>
                    <p class="form-hint profile-field-full">Liên hệ Quản trị viên để thay đổi Email hoặc Vai trò.</p>
                </div>

                <hr class="profile-divider">

                <h3 class="profile-section-title">Thông tin cá nhân</h3>
                <div class="profile-grid">
                    <div class="form-group profile-field-full">
                        <label class="form-label" for="full-name">Họ và tên <span aria-hidden="true">*</span></label>
                        <input class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                               id="full-name" type="text" th:field="*{fullName}"
                               maxlength="100" autocomplete="name" required
                               th:attr="aria-invalid=${#fields.hasErrors('fullName')},aria-describedby=${#fields.hasErrors('fullName') ? 'full-name-error' : null}">
                        <span id="full-name-error" class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="phone-number">Số điện thoại</label>
                        <input class="form-control" th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''"
                               id="phone-number" type="tel" th:field="*{phoneNumber}"
                               maxlength="10" autocomplete="tel"
                               th:attr="aria-invalid=${#fields.hasErrors('phoneNumber')},aria-describedby=${#fields.hasErrors('phoneNumber') ? 'phone-number-error' : 'phone-number-hint'}">
                        <small id="phone-number-hint" class="form-hint">Gồm 10 chữ số, bắt đầu bằng 0.</small>
                        <span id="phone-number-error" class="form-error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></span>
                    </div>
                </div>

            </form>
        </section>
    </div>
    </div>

    <!-- Hộp thoại đổi mật khẩu -->
    <dialog id="changePasswordModal" class="profile-modal" aria-labelledby="change-password-title">
        <div class="profile-modal-header">
            <h2 id="change-password-title">Đổi mật khẩu</h2>
            <button class="profile-modal__close" type="button" onclick="document.getElementById('changePasswordModal').close()" aria-label="Đóng">&times;</button>
        </div>

        <form id="changePasswordForm" th:action="@{/profile/change-password}" th:object="${passwordRequest}" method="post">
            <!-- CSRF -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group profile-password-field">
                <label class="form-label" for="currentPassword">Mật khẩu hiện tại <span aria-hidden="true">*</span></label>
                <div class="profile-input-wrap">
                    <input class="form-control profile-password-input" th:classappend="${#fields != null and #fields.hasErrors('currentPassword')} ? 'is-invalid' : ''"
                           id="currentPassword" type="password" th:field="*{currentPassword}"
                           data-password-own-toggle="true"
                           autocomplete="current-password" required
                           aria-describedby="currentPassword-error">
                    <button type="button" class="profile-password-toggle" onclick="togglePasswordVisibility('currentPassword', this)" aria-label="Hiện mật khẩu" tabindex="-1">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <span class="form-error" id="currentPassword-error" th:if="${#fields != null and #fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
            </div>
            <div class="form-group profile-password-field">
                <label class="form-label" for="newPassword">Mật khẩu mới <span aria-hidden="true">*</span></label>
                <div class="profile-input-wrap">
                    <input class="form-control profile-password-input" th:classappend="${#fields != null and #fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                           id="newPassword" type="password" th:field="*{newPassword}"
                           data-password-own-toggle="true"
                           minlength="8" maxlength="32" autocomplete="new-password" required
                           aria-describedby="newPassword-hint newPassword-error">
                    <button type="button" class="profile-password-toggle" onclick="togglePasswordVisibility('newPassword', this)" aria-label="Hiện mật khẩu" tabindex="-1">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <small id="newPassword-hint" class="form-hint">8–32 ký tự, dùng được mọi ký tự đặc biệt.</small>
                <span class="form-error" id="newPassword-error" th:if="${#fields != null and #fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
            </div>
            <div class="form-group profile-password-field">
                <label class="form-label" for="confirmPassword">Nhập lại mật khẩu mới <span aria-hidden="true">*</span></label>
                <div class="profile-input-wrap">
                    <input class="form-control profile-password-input" th:classappend="${#fields != null and #fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                           id="confirmPassword" type="password" th:field="*{confirmPassword}"
                           data-password-own-toggle="true"
                           minlength="8" maxlength="32" autocomplete="new-password" required
                           aria-describedby="confirmPassword-error">
                    <button type="button" class="profile-password-toggle" onclick="togglePasswordVisibility('confirmPassword', this)" aria-label="Hiện mật khẩu" tabindex="-1">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <span class="form-error" id="confirmPassword-error" th:if="${#fields != null and #fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            </div>
            <div class="profile-actions">
                <button class="btn btn--secondary btn-secondary" type="button" onclick="document.getElementById('changePasswordModal').close()">Hủy</button>
                <button class="btn btn--primary btn-primary" id="btnSubmitPassword" type="submit">Đổi mật khẩu</button>
            </div>
        </form>
    </dialog>
</main>

<th:block layout:fragment="scripts">
    <th:block th:replace="~{fragments/ui/admin-workspace :: scripts}"></th:block>
    <script th:inline="javascript">
        /*[# th:if="${openPasswordModal}"]*/
        document.addEventListener('DOMContentLoaded', function() {
            var modal = document.getElementById('changePasswordModal');
            if (modal && typeof modal.showModal === 'function') {
                modal.showModal();
            }
        });
        /*[/]*/

        function togglePasswordVisibility(inputId, btn) {
            var input = document.getElementById(inputId);
            if (!input) return;
            var isPass = input.type === 'password';
            input.type = isPass ? 'text' : 'password';
            btn.classList.toggle('active', isPass);
            btn.setAttribute('aria-label', isPass ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
            btn.innerHTML = isPass
                ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
                : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        }

        document.addEventListener('DOMContentLoaded', function() {
            var modal = document.getElementById('changePasswordModal');
            if (modal) {
                modal.addEventListener('click', function(e) {
                    var rect = modal.getBoundingClientRect();
                    var isInDialog = (rect.top <= e.clientY && e.clientY <= rect.top + rect.height &&
                                      rect.left <= e.clientX && e.clientX <= rect.left + rect.width);
                    if (!isInDialog) {
                        modal.close();
                    }
                });
            }
        });
    </script>
</th:block>
</body>
</html>
