<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<dialog th:fragment="send(titleId)" id="sendOfferConfirmDialog" class="confirm-dialog"
        th:attr="aria-labelledby=${titleId}">
    <div class="dialog-content">
        <div class="dialog-header">
            <h3 th:id="${titleId}" class="dialog-title">Gửi thư mời nhận việc?</h3>
        </div>
        <div class="dialog-body">
            <p>Bạn có chắc chắn muốn gửi thư mời nhận việc tới ứng viên? Ứng viên sẽ thấy thư mời và thời hạn phản hồi trên cổng ứng viên.</p>
        </div>
        <div class="dialog-actions">
            <button type="button" class="btn btn--secondary" onclick="this.closest('dialog').close()">Hủy</button>
            <button type="button" id="btnConfirmSendOfferModal" class="btn btn--primary" onclick="executeSendOfferAction()">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" class="ofw-btn-icon-inline"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                Phát hành thư mời
            </button>
        </div>
    </div>
</dialog>
<dialog th:fragment="delete(successUrl)" id="deleteOfferDialog" class="confirm-dialog" aria-labelledby="deleteOfferTitle"
        th:attr="data-success-url=${successUrl}">
    <div class="dialog-content">
        <div class="dialog-header"><h3 id="deleteOfferTitle" class="dialog-title">Xóa bản nháp?</h3></div>
        <div class="dialog-body"><p>Bạn có chắc chắn muốn xóa bản nháp thư mời nhận việc này?</p></div>
        <div class="dialog-actions">
            <button type="button" class="btn btn--secondary" autofocus onclick="this.closest('dialog').close()">Hủy</button>
            <button type="button" onclick="executeDeleteOffer(this)"
                    class="btn btn--danger">Xóa bản nháp</button>
        </div>
    </div>
</dialog>
</body>
</html>
