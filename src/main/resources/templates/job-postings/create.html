<!DOCTYPE html>
<!-- Form Tạo / Sửa tin tuyển dụng (/internal/job-postings/create, /{id}/edit), theo mockup đã được GV duyệt.
     Bên trái: soạn tin. Bên phải: "Ứng viên sẽ thấy" (xem trước, JS dựng lại khi gõ).
     Quy tắc kiểm tra ở server: JobPostingValidator#normalizeAndValidate; JS (pages/job-posting-form.js) chỉ báo lỗi sớm. -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/internal}">

<head>
    <title th:text="${isEdit ? 'Chỉnh sửa tin tuyển dụng' : 'Tạo tin tuyển dụng'}">Tạo tin tuyển dụng</title>
    <th:block layout:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/job-posting-form.css}">
    </th:block>
</head>

<body>
    <main id="main" layout:fragment="content" class="page-content container adw-page" tabindex="-1"
        th:with="draftOrNew=${form.draftOrNew}, paused=${form.paused}">
        <th:block th:replace="~{fragments/ui/admin-workspace :: scene}"></th:block>

        <h1 class="adw-title" th:text="${isEdit ? 'Chỉnh sửa tin tuyển dụng' : 'Tạo tin tuyển dụng'}">Tạo tin tuyển dụng
        </h1>
        <p class="jpf-lead">Nội dung được điền sẵn từ yêu cầu tuyển dụng đã duyệt</p>


        <form id="posting-form" class="jpf-form" method="post" th:object="${form}" novalidate
            th:action="${isEdit} ? @{/internal/job-postings/{id}/edit(id=*{jobPostingId})} : @{/internal/job-postings/create}"
            th:data-today="${today}" th:data-salary-range="*{salaryRangeLabel}" th:data-department="*{departmentName}"
            th:data-draft="${draftOrNew}" th:data-posting-date="*{postingDate}">
            <input type="hidden" th:field="*{jobPostingId}">
            <input type="hidden" th:field="*{requisitionId}">

            <!-- Lỗi từ server: tóm tắt ở đầu form, chi tiết hiện cạnh từng ô -->
            <section th:if="${#fields.hasAnyErrors()}" id="jpf-summary" class="alert alert--danger" role="alert"
                tabindex="-1">
                <strong th:text="|Còn ${#lists.size(#fields.allErrors())} mục cần sửa|">Còn 2 mục cần sửa</strong>
                <ul>
                    <li th:each="error : ${#fields.allErrors()}" th:text="${error}">Vui lòng nhập tiêu đề tin.</li>
                </ul>
            </section>

            <!-- Điện thoại: chuyển giữa Soạn tin / Xem trước (màn rộng thì hiện cả hai cột) -->
            <div class="jpf-tabs" role="tablist" aria-label="Soạn tin hoặc xem trước">
                <button type="button" role="tab" data-tab="edit" aria-selected="true">Soạn tin</button>
                <button type="button" role="tab" data-tab="preview" aria-selected="false">Xem trước</button>
            </div>

            <div class="jpf-layout">
                <div class="card jpf-main adw-surface">

                    <!-- ===== 1. THÔNG TIN HIỂN THỊ ===== -->
                    <section class="jpf-sec" aria-labelledby="jpf-h1">
                        <h2 id="jpf-h1">Tổng quan</h2>

                        <div class="jpf-pair">
                            <div class="jpf-field">
                                <div class="jpf-lblrow"><label class="form-label" for="postingTitle">Tiêu đề tin <span
                                            class="required-asterisk">*</span></label>
                                </div>
                                <input class="form-input" th:field="*{postingTitle}" th:maxlength="${titleLimit}"
                                    placeholder="Nhập tiêu đề tin tuyển dụng"
                                    aria-describedby="postingTitle-error">
                                <small id="postingTitle-error" class="field-error"
                                    th:text="${#fields.hasErrors('postingTitle')} ? ${#fields.errors('postingTitle')[0]} : ''"></small>
                            </div>
                            <div class="jpf-field">
                                <input type="hidden" name="showPositions" value="true">
                                <div class="jpf-lblrow"><label class="form-label" for="numberOfPositionsDisplay">Số lượng cần
                                        tuyển <span class="required-asterisk">*</span></label>
                                </div>
                                <input class="form-input" type="number" th:field="*{numberOfPositionsDisplay}"
                                    min="1" step="1" inputmode="numeric" placeholder="Nhập số lượng tuyển"
                                    aria-describedby="numberOfPositionsDisplay-error">
                                <small id="numberOfPositionsDisplay-error" class="field-error"
                                    th:text="${#fields.hasErrors('numberOfPositionsDisplay')} ? ${#fields.errors('numberOfPositionsDisplay')[0]} : ''"></small>
                            </div>
                        </div>

                        <!-- Hình thức và Mô hình: điền sẵn từ yêu cầu, HR đổi được cho riêng tin này -->
                        <div class="jpf-pair">
                            <div class="jpf-field">
                                <div class="jpf-lblrow"><label class="form-label" for="employmentType">Hình thức làm việc <span
                                            class="required-asterisk">*</span></label>
                                </div>
                                <select class="form-select" th:field="*{employmentType}"
                                    aria-describedby="employmentType-error">
                                    <option value="Full-time">Toàn thời gian</option>
                                    <option value="Part-time">Bán thời gian</option>
                                    <option value="Internship">Thực tập</option>
                                    <option value="Freelance">Freelance</option>
                                </select>
                                <small id="employmentType-error" class="field-error"
                                    th:text="${#fields.hasErrors('employmentType')} ? ${#fields.errors('employmentType')[0]} : ''"></small>
                            </div>
                            <div class="jpf-field">
                                <div class="jpf-lblrow"><label class="form-label" for="workModel">Mô hình làm việc <span
                                            class="required-asterisk">*</span></label>
                                </div>
                                <select class="form-select" th:field="*{workModel}" aria-describedby="workModel-error">
                                    <option value="On-site">Tại văn phòng</option>
                                    <option value="Hybrid">Kết hợp</option>
                                    <option value="Remote">Từ xa</option>
                                </select>
                                <small id="workModel-error" class="field-error"
                                    th:text="${#fields.hasErrors('workModel')} ? ${#fields.errors('workModel')[0]} : ''"></small>
                            </div>
                        </div>

                        <!-- Hạn ứng tuyển và mức lương nằm cùng một hàng; màn hẹp tự xuống dòng. -->
                        <div class="jpf-pair">
                            <div class="jpf-field">
                                <label class="form-label" for="applicationDeadline">Hạn ứng tuyển <span
                                        class="required-asterisk">*</span></label>
                                <input class="form-input" type="date" th:field="*{applicationDeadline}"
                                    th:min="${today}" aria-describedby="applicationDeadline-error">
                                <small id="applicationDeadline-error" class="field-error"
                                    th:text="${#fields.hasErrors('applicationDeadline')} ? ${#fields.errors('applicationDeadline')[0]} : ''"></small>
                            </div>
                            <!-- Một ô chữ, điền sẵn mức lương của yêu cầu (hoặc "Thỏa thuận"). -->
                            <div class="jpf-field" id="salaryMode-group">
                                <input type="hidden" name="salaryMode" value="custom">
                                <div class="jpf-lblrow"><label class="form-label" for="salaryCustom">Mức lương
                                        <span class="required-asterisk">*</span></label>
                                </div>
                                <input class="form-input" id="salaryCustom" name="salaryCustom"
                                    th:value="*{salaryMode == 'range' ? salaryRangeLabel : (salaryMode == 'nego' ? 'Thỏa thuận' : salaryCustom)}"
                                    th:maxlength="${salaryTextLimit}" placeholder="Ví dụ: 12 - 18 triệu VND/tháng"
                                    aria-describedby="salaryCustom-error">
                                <small id="salaryMode-error" class="field-error"
                                    th:text="${#fields.hasErrors('salaryMode')} ? ${#fields.errors('salaryMode')[0]} : ''"></small>
                                <small id="salaryCustom-error" class="field-error"
                                    th:text="${#fields.hasErrors('salaryCustom')} ? ${#fields.errors('salaryCustom')[0]} : ''"></small>
                            </div>
                        </div>
                    </section>

                    <!-- ===== 2. NỘI DUNG TIN ===== -->
                    <section class="jpf-sec" aria-labelledby="jpf-h2">
                        <h2 id="jpf-h2">Nội dung tin</h2>
                        <div class="jpf-field">
                            <div class="jpf-lblrow"><label class="form-label" for="jobDescription">Mô tả công việc <span
                                        class="required-asterisk">*</span></label>
                            </div>
                            <textarea class="form-textarea" th:field="*{jobDescription}" rows="7"
                                th:maxlength="${textLimit}" placeholder="Nhập mô tả công việc"
                                aria-describedby="jobDescription-error"></textarea>
                            <small id="jobDescription-error" class="field-error"
                                th:text="${#fields.hasErrors('jobDescription')} ? ${#fields.errors('jobDescription')[0]} : ''"></small>
                        </div>
                        <div class="jpf-field">
                            <div class="jpf-lblrow"><label class="form-label" for="jobRequirements">Yêu cầu ứng viên
                                    <span class="required-asterisk">*</span></label>
                            </div>
                            <textarea class="form-textarea" th:field="*{jobRequirements}" rows="6"
                                th:maxlength="${textLimit}" placeholder="Nhập yêu cầu ứng viên"
                                aria-describedby="jobRequirements-error"></textarea>
                            <small id="jobRequirements-error" class="field-error"
                                th:text="${#fields.hasErrors('jobRequirements')} ? ${#fields.errors('jobRequirements')[0]} : ''"></small>
                        </div>
                        <div class="jpf-field">
                            <label class="form-label" for="benefits">Quyền lợi ứng viên</label>
                            <textarea class="form-textarea" th:field="*{benefits}" rows="5" th:maxlength="${textLimit}"
                                placeholder="Nhập quyền lợi ứng viên, mỗi quyền lợi một dòng"
                                aria-describedby="benefits-error"></textarea>
                            <small id="benefits-error" class="field-error"
                                th:text="${#fields.hasErrors('benefits')} ? ${#fields.errors('benefits')[0]} : ''"></small>
                        </div>
                    </section>

                    <!-- ===== 3. ĐỊA ĐIỂM VÀ THỜI GIAN (cùng thứ tự với trang ứng viên /jobs/{id}) ===== -->
                    <section class="jpf-sec" aria-labelledby="jpf-h3">
                        <h2 id="jpf-h3">Địa điểm và thời gian</h2>

                        <div class="jpf-field">
                            <div class="jpf-lblrow"><label class="form-label" for="workLocation">Địa điểm làm
                                    việc</label>
                            </div>
                            <input class="form-input" th:field="*{workLocation}" th:maxlength="${locationLimit}"
                                placeholder="Nhập địa điểm làm việc" th:disabled="*{workModel == 'Remote'}"
                                aria-describedby="workLocation-help workLocation-error">
                            <small id="workLocation-error" class="field-error"
                                th:text="${#fields.hasErrors('workLocation')} ? ${#fields.errors('workLocation')[0]} : ''"></small>
                        </div>

                        <div class="jpf-field">
                            <label class="form-label" for="workingHours">Thời gian làm việc</label>
                            <input class="form-input" th:field="*{workingHours}" th:maxlength="${workingHoursLimit}"
                                placeholder="Nhập thời gian làm việc" aria-describedby="workingHours-error">
                            <small id="workingHours-error" class="field-error"
                                th:text="${#fields.hasErrors('workingHours')} ? ${#fields.errors('workingHours')[0]} : ''"></small>
                        </div>
                    </section>

                    <!-- ===== Nút ===== -->
                    <div class="jpf-actions">
                        <a class="btn btn--secondary"
                            th:href="${isEdit} ? @{/internal/job-postings/{id}(id=*{jobPostingId})} : @{/internal/job-postings}">Hủy</a>
                        <!-- Nháp / tạo mới: Lưu nháp + Đăng tin -->
                        <th:block th:if="${draftOrNew}">
                            <button class="btn btn--secondary" type="submit" name="action" value="draft"
                                formnovalidate>Lưu nháp</button>
                            <button class="btn btn--primary" type="submit" name="action" value="publish"
                                id="jpf-publish">Đăng tin</button>
                        </th:block>
                        <!-- Đang đăng: lưu thay đổi, trạng thái giữ nguyên -->
                        <button th:if="${!draftOrNew and !paused}" class="btn btn--primary" type="submit" name="action"
                            value="draft">Lưu thay đổi</button>
                        <!-- Tạm dừng: lưu thay đổi (vẫn tạm dừng) hoặc lưu và mở lại nhận hồ sơ -->
                        <th:block th:if="${paused}">
                            <button class="btn btn--secondary" type="submit" name="action" value="draft">Lưu thay
                                đổi</button>
                            <button class="btn btn--primary" type="submit" name="action" value="publish">Lưu và mở
                                lại</button>
                        </th:block>
                    </div>
                </div>

                <!-- ===== Xem trước: ứng viên sẽ thấy ===== -->
                <aside class="jpf-preview-col" aria-label="Xem trước tin tuyển dụng">
                    <span class="jpf-k">Ứng viên sẽ thấy</span>
                    <article class="card jpf-preview adw-surface" id="jpf-preview" aria-live="off"></article>
                </aside>
            </div>
        </form>
    </main>

    <th:block layout:fragment="scripts">
        <th:block th:replace="~{fragments/ui/admin-workspace :: scripts}"></th:block>
        <!-- text-limit.js: báo lỗi đỏ "Nội dung quá N ký tự" khi gõ / dán vượt maxlength -->
        <script th:src="@{/js/text-limit.js}" defer></script>
        <script th:src="@{/js/pages/job-posting-form.js}" defer></script>
    </th:block>
</body>

</html>
