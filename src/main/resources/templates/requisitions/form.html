<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${isEdit ? 'Edit Requisition' : 'Create Requisition'} + ' | RMS'">Requisition Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app-layout.css}">
    <link rel="stylesheet" th:href="@{/css/requisition-form.css}">
<link rel="stylesheet" th:href="@{/css/requisition-shared.css}">
<script th:src="@{/js/requisitions.js}" defer></script>
</head>
<body class="req-app">
<div class="page-wrapper">
    <aside th:replace="~{fragments/sidebar :: sidebar(activeMenu='requisitions')}"></aside>
    <div class="main-content">
        <header th:replace="~{fragments/requisition :: topbar}"></header>
        <main class="page-content">
            <form class="form-container" id="requisition-form" th:object="${requisitionDto}" th:action="${isEdit} ? @{/requisitions/edit/{id}(id=${requisitionId})} : @{/requisitions/create}" method="post">
                <input type="hidden" th:field="*{version}"><p class="notice" th:if="${copyNotice}" th:text="${copyNotice}"></p>

                <section th:if="${#fields.hasAnyErrors()}" id="validation-summary" role="alert" tabindex="-1" class="alert alert-danger" style="margin-bottom: 20px;">
                    <p style="font-weight:600;">Please check the following details:</p>
                    <ul style="padding-left: 20px; margin-top: 8px;"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
                </section>

                <!-- Basic Information -->
                <div class="form-card">
                    <div class="form-card-header">
                        <div class="icon-wrapper"><i class="fa-regular fa-file-lines"></i></div>
                        <h2>Basic Information</h2>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="title">Job Title <span class="required-asterisk">*</span></label>
                            <input class="form-control-custom" type="text" th:field="*{title}" placeholder="Enter job title" maxlength="200" required><small class="field-error" th:errors="*{title}"></small>
                        </div>
                        <div class="form-group">
                            <label for="employmentType">Employment Type <span class="required-asterisk">*</span></label>
                            <select class="form-control-custom" th:field="*{employmentType}" required>
                                <option value="">Select employment type</option>
                                <option th:each="type : ${employmentTypes}" th:value="${type}" th:text="${type}"></option>
                            </select><small class="field-error" th:errors="*{employmentType}"></small>
                        </div>
                        <div class="form-group">
                            <label for="departmentId">Department <span class="required-asterisk">*</span></label>
                            <select class="form-control-custom" th:field="*{departmentId}" required>
                                <option value="">Select department</option>
                                <option th:each="department : ${departments}" th:value="${department.departmentId}" th:text="${department.departmentName}"></option>
                            </select><small class="field-error" th:errors="*{departmentId}"></small>
                        </div>
                        <div class="form-group">
                            <label for="numberOfPositions">Number of Openings <span class="required-asterisk">*</span></label>
                            <input class="form-control-custom" type="number" th:field="*{numberOfPositions}" value="1" min="1" required><small class="field-error" th:errors="*{numberOfPositions}"></small>
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <select class="form-control-custom" th:field="*{gender}">
                                <option value="Any">Any</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select><small class="field-error" th:errors="*{gender}"></small>
                        </div>
                        <div class="form-group">
                            <label for="expectedStartDate">Expected Start Date <span class="required-asterisk">*</span></label>
                            <input class="form-control-custom" type="date" th:field="*{expectedStartDate}" required><small class="field-error" th:errors="*{expectedStartDate}"></small>
                        </div>
                        <div class="form-group">
                            <label for="workingHours">Working Hours</label><input class="form-control-custom" type="text" th:field="*{workingHours}" maxlength="255" placeholder="e.g. Monday–Friday, 08:00–17:00"><small class="field-error" th:errors="*{workingHours}"></small>
                        </div>
                        <div class="form-group">
                            <label for="workLocation">Location <span class="required-asterisk">*</span></label>
                            <input class="form-control-custom" type="text" th:field="*{workLocation}" placeholder="Enter work location" maxlength="255" required><small class="field-error" th:errors="*{workLocation}"></small>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Proposed Salary Range (VND)</label>
                            <div class="salary-range">
                                <input class="form-control-custom" type="number" th:field="*{minSalary}" placeholder="Min salary" min="0" step="0.01" aria-label="Minimum salary">
                                <span>-</span>
                                <input class="form-control-custom" type="number" th:field="*{maxSalary}" placeholder="Max salary" min="0" step="0.01" aria-label="Maximum salary">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Reason for Hiring -->
                <div class="form-card">
                    <div class="form-card-header">
                        <div class="icon-wrapper"><i class="fa-regular fa-comment-dots"></i></div>
                        <h2><label for="reasonForHiring">Reason for Hiring <span class="required-asterisk">*</span></label></h2>
                    </div>
                    <textarea class="textarea-custom" th:field="*{reasonForHiring}" aria-describedby="reasonForHiring-count" placeholder="Enter reason for hiring (e.g., new position, replacement, business expansion...)" maxlength="2000" required></textarea>
                    <div class="char-counter" id="reasonForHiring-count">0/2000</div><small class="field-error" th:errors="*{reasonForHiring}"></small>
                </div>

                <!-- Job Description -->
                <div class="form-card">
                    <div class="form-card-header">
                        <div class="icon-wrapper"><i class="fa-regular fa-file-alt"></i></div>
                        <h2><label for="jobDescription">Job Description <span class="required-asterisk">*</span></label></h2>
                    </div>
                    <textarea class="textarea-custom" th:field="*{jobDescription}" aria-describedby="jobDescription-count" placeholder="Enter detailed job description..." maxlength="2000" required></textarea>
                    <div class="char-counter" id="jobDescription-count">0/2000</div><small class="field-error" th:errors="*{jobDescription}"></small>
                </div>

                <!-- Candidate Requirements -->
                <div class="form-card">
                    <div class="form-card-header">
                        <div class="icon-wrapper"><i class="fa-solid fa-user-check"></i></div>
                        <h2><label for="requirementDetails">Candidate Requirements <span class="required-asterisk">*</span></label></h2>
                    </div>
                    <textarea class="textarea-custom" th:field="*{requirementDetails}" aria-describedby="requirementDetails-count" placeholder="Enter candidate requirements (skills, experience, education, etc.)..." maxlength="2000" required></textarea>
                    <div class="char-counter" id="requirementDetails-count">0/2000</div><small class="field-error" th:errors="*{requirementDetails}"></small>
                </div>

                <!-- Screening Criteria -->
                <div class="form-card">
                    <div class="form-card-header header-actions">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div class="icon-wrapper"><i class="fa-solid fa-list-check"></i></div>
                            <h2>Screening Criteria</h2><small class="field-error" th:errors="*{screeningCriteria}"></small>
                        </div>
                        <button type="button" class="btn-add-criteria" id="btn-add-criteria">+ Add Criteria</button>
                    </div>
                    <p class="field-error" id="criteria-error" role="alert" hidden></p><div class="criteria-scroll"><table class="criteria-table-custom">
                        <thead>
                            <tr>
                                <th style="width: 40px;">#</th>
                                <th>CRITERIA <span class="required-asterisk">*</span></th>
                                <th>CRITERIA TYPE <span class="required-asterisk">*</span></th>
                                <th>REQUIRED VALUE <span class="required-asterisk">*</span></th>
                                <th style="width: 100px;">WEIGHT (%) <span class="required-asterisk">*</span></th>
                                <th style="width: 120px;">MANDATORY</th>
                                <th style="width: 60px;">ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="criteria-rows">
                            <tr th:each="criterion, row : *{screeningCriteria}">
                                <td class="row-index" th:text="${row.count}">1</td>
                                <td>
                                    <input type="hidden" th:field="*{screeningCriteria[__${row.index}__].criteriaId}">
                                    <input class="form-control-custom" th:field="*{screeningCriteria[__${row.index}__].criteriaName}" placeholder="Enter criteria name" maxlength="150" required>
                                </td>
                                <td>
                                    <select class="form-control-custom" th:field="*{screeningCriteria[__${row.index}__].criteriaType}" required>
                                        <option value="">Select type</option>
                                        <option th:each="type : ${criteriaTypes}" th:value="${type}" th:text="${type}"></option>
                                    </select>
                                </td>
                                <td><input class="form-control-custom" th:field="*{screeningCriteria[__${row.index}__].requiredValue}" placeholder="Enter required value" maxlength="255" required></td>
                                <td><input class="form-control-custom" type="number" th:field="*{screeningCriteria[__${row.index}__].weight}" min="0.01" max="100" step="0.01" required></td>
                                <td>
                                    <div class="switch-label">
                                        <label class="switch">
                                            <input type="checkbox" th:field="*{screeningCriteria[__${row.index}__].isMandatory}">
                                            <span class="slider"></span>
                                        </label>
                                        <span class="switch-text">No</span>
                                    </div>
                                </td>
                                <td><button type="button" class="btn-trash" data-remove-criterion aria-label="Remove criterion"><i class="fa-solid fa-trash-can"></i></button></td>
                            </tr>
                        </tbody>
                    </table></div>
                    <template id="criteria-template">
                        <tr>
                            <td class="row-index"></td>
                            <td>
                                <input type="hidden" name="screeningCriteria[__INDEX__].criteriaId">
                                <input class="form-control-custom" name="screeningCriteria[__INDEX__].criteriaName" placeholder="Enter criteria name" maxlength="50" required>
                            </td>
                            <td>
                                <select class="form-control-custom" name="screeningCriteria[__INDEX__].criteriaType" required>
                                    <option value="">Select type</option>
                                    <option value="Education">Education</option>
                                    <option value="Experience">Experience</option>
                                    <option value="Skill">Skill</option>
                                    <option value="Knockout">Knockout</option>
                                </select>
                            </td>
                            <td><input class="form-control-custom" name="screeningCriteria[__INDEX__].requiredValue" placeholder="Enter required value" maxlength="255" required></td>
                            <td><input class="form-control-custom" type="number" name="screeningCriteria[__INDEX__].weight" min="0.01" max="100" step="0.01" required></td>
                            <td>
                                <div class="switch-label">
                                    <label class="switch">
                                        <input type="hidden" name="_screeningCriteria[__INDEX__].isMandatory" value="on"><input type="checkbox" name="screeningCriteria[__INDEX__].isMandatory" value="true">
                                        <span class="slider"></span>
                                    </label>
                                    <span class="switch-text">No</span>
                                </div>
                            </td>
                            <td><button type="button" class="btn-trash" data-remove-criterion aria-label="Remove criterion"><i class="fa-solid fa-trash-can"></i></button></td>
                        </tr>
                    </template>
                </div>

                <!-- Footer Actions -->
                <div class="form-footer-actions">
                    <a class="btn-footer btn-cancel-custom" th:href="${isEdit} ? @{/requisitions/{id}(id=${requisitionId})} : @{/requisitions}">&#10005; Cancel</a>
                    <button type="submit" name="action" value="draft" class="btn-footer btn-save-draft" formnovalidate>Save Draft</button>
                    <button type="submit" name="action" value="submit" class="btn-footer btn-submit-director">Submit to Director</button>
                </div>
            </form>
        </main>
    </div>
</div>

</body>
</html>
