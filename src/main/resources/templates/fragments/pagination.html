<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Adapter tương thích ngược: Chuyển tiếp tới linh kiện chuẩn fragments/ui/pagination -->
<nav th:fragment="paged(page, baseUrl)"
     th:replace="~{fragments/ui/pagination :: pagedWithUrl(${page}, ${baseUrl})}">
</nav>

<nav th:fragment="pager(currPage, totPages, totElements, baseUrl)"
     th:if="${totPages != null and totPages > 0 and (totPages > 1 or totElements > 0)}"
     th:with="lastPage=${totPages - 1}, windowPage=${T(java.lang.Math).max(0, T(java.lang.Math).min(currPage, lastPage))}"
     class="pagination-wrapper"
     aria-label="Phân trang">
    <div class="pagination-info">
        <span th:if="${currPage == windowPage}">Trang <strong th:text="${currPage + 1}">1</strong>/<strong th:text="${totPages}">1</strong></span>
        <span th:unless="${currPage == windowPage}">Trang yêu cầu không tồn tại.</span>
        <span>(<span th:text="${totElements}">0</span> bản ghi)</span>
    </div>
    <div class="pagination-controls">
        <ul class="pagination-list"
            th:with="startPage=${T(java.lang.Math).max(0, windowPage - 2)}, endPage=${windowPage + T(java.lang.Math).min(2, lastPage - windowPage)}, previousPage=${currPage > lastPage ? lastPage : windowPage - 1}">
            <li class="page-item">
                <a th:if="${currPage > 0}" th:href="@{${baseUrl}(page=${previousPage})}" class="page-link">&lsaquo;</a>
                <span th:unless="${currPage > 0}" class="page-link disabled">&lsaquo;</span>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(startPage, endPage)}">
                <a th:if="${i != currPage}" th:href="@{${baseUrl}(page=${i})}" th:text="${i + 1}" class="page-link">1</a>
                <span th:if="${i == currPage}" th:text="${i + 1}" class="page-link active" aria-current="page">1</span>
            </li>
            <li class="page-item">
                <a th:if="${currPage < lastPage}" th:href="@{${baseUrl}(page=${currPage < 0 ? 0 : currPage + 1})}" class="page-link">&rsaquo;</a>
                <span th:unless="${currPage < lastPage}" class="page-link disabled">&rsaquo;</span>
            </li>
        </ul>
    </div>
</nav>

</body>
</html>
