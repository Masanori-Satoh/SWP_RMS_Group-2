<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Adapter tương thích ngược: Chuyển tiếp tới linh kiện chuẩn fragments/ui/pagination -->
<nav th:fragment="paged(page, baseUrl)"
     th:replace="~{fragments/ui/pagination :: pagedWithUrl(${page}, ${baseUrl})}">
</nav>

<nav th:fragment="pager(currPage, totPages, totElements, baseUrl)"
     th:if="${totPages != null and totPages >= 1 and (totElements == null or totElements > 0)}"
     class="pagination-wrapper"
     aria-label="Phân trang">
    <div class="pagination-info">
        <span>Trang <strong th:text="${currPage + 1}">1</strong>/<strong th:text="${totPages}">1</strong></span>
        <span>(<span th:text="${totElements}">0</span> bản ghi)</span>
    </div>
    <div class="pagination-controls">
        <ul class="pagination-list"
            th:with="startPage=${T(java.lang.Math).max(0, currPage - 2)}, endPage=${T(java.lang.Math).min(totPages - 1, currPage + 2)}, isZeroBased=${baseUrl == '/offers'}">
            <li class="page-item">
                <a th:if="${currPage > 0}"
                   th:href="${isZeroBased ? (pageLinks != null ? pageLinks.to(currPage - 1) : @{${baseUrl}(page=${currPage - 1})}) : (pageLinks != null ? pageLinks.to(currPage) : @{${baseUrl}(page=${currPage})})}"
                   th:onclick="'if(window.rmsGoToPage){window.rmsGoToPage(' + (${currPage - 1}) + ');return false;}'"
                   class="page-link"
                   aria-label="Trang trước">&lsaquo;</a>
                <span th:unless="${currPage > 0}" class="page-link disabled">&lsaquo;</span>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(startPage, endPage)}">
                <a th:if="${i != currPage}"
                   th:href="${isZeroBased ? (pageLinks != null ? pageLinks.to(i) : @{${baseUrl}(page=${i})}) : (pageLinks != null ? pageLinks.to(i + 1) : @{${baseUrl}(page=${i + 1})})}"
                   th:onclick="'if(window.rmsGoToPage){window.rmsGoToPage(' + ${i} + ');return false;}'"
                   th:text="${i + 1}"
                   class="page-link">1</a>
                <span th:if="${i == currPage}" th:text="${i + 1}" class="page-link active" aria-current="page">1</span>
            </li>
            <li class="page-item">
                <a th:if="${currPage < totPages - 1}"
                   th:href="${isZeroBased ? (pageLinks != null ? pageLinks.to(currPage + 1) : @{${baseUrl}(page=${currPage + 1})}) : (pageLinks != null ? pageLinks.to(currPage + 2) : @{${baseUrl}(page=${currPage + 2})})}"
                   th:onclick="'if(window.rmsGoToPage){window.rmsGoToPage(' + (${currPage + 1}) + ');return false;}'"
                   class="page-link"
                   aria-label="Trang sau">&rsaquo;</a>
                <span th:unless="${currPage < totPages - 1}" class="page-link disabled">&rsaquo;</span>
            </li>
        </ul>
    </div>
</nav>

</body>
</html>
