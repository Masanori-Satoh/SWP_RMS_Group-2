<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<header th:fragment="topbar" class="topbar"><span class="topbar-title">Hệ thống Quản lý Tuyển dụng (RMS)</span><div class="topbar-actions"><span>Xin chào, <strong th:text="${viewerName}"></strong></span><form th:action="@{/logout}" method="post"><button type="submit" class="logout-button">Đăng xuất</button></form></div></header>
<nav th:fragment="breadcrumb(current)" class="requisition-page-breadcrumb" aria-label="Điều hướng">
    <a th:href="@{/dashboard}">Bảng điều khiển</a><span aria-hidden="true">/</span>
    <a th:href="@{/requisitions}">Yêu cầu tuyển dụng</a><span aria-hidden="true">/</span>
    <span aria-current="page" th:text="${current}"></span>
</nav>
<span th:fragment="informationIcon" class="icon-wrapper" aria-hidden="true">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M8 9h8M8 12h8M8 15h4"/></svg>
</span>
<th:block th:fragment="messages"><p class="notice" role="status" th:if="${successMessage}" th:text="${successMessage}"></p><p class="alert alert-danger" role="alert" th:if="${failureMessage}" th:text="${failureMessage}"></p></th:block>
<dialog th:fragment="deleteDialog" id="delete-dialog" aria-labelledby="delete-title"><form id="delete-form" method="post" th:action="@{/requisitions}"><div class="delete-symbol" aria-hidden="true">!</div><h2 id="delete-title">Xóa yêu cầu tuyển dụng</h2><p>Bạn có chắc chắn muốn xóa “<strong id="delete-name"></strong>” cùng toàn bộ tiêu chí và lịch sử phê duyệt liên quan?</p><p class="muted">Hành động này không thể hoàn tác. Lịch sử nhật ký hệ thống vẫn sẽ được lưu trữ.</p><div class="dialog-actions"><button type="button" class="btn-outline" data-close-dialog>Hủy</button><button class="btn-danger" type="submit">Xác nhận xóa</button></div></form></dialog>
</body></html>
