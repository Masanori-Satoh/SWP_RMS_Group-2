<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- =============================================================================
     1. JOBCARD FRAGMENT: Thẻ việc làm chuẩn phong cách Mộc
     Cách gọi: <article th:replace="~{fragments/ui/cards :: jobCard(job=${item})}"></article>
     ============================================================================= -->
<article th:fragment="jobCard(job)" class="job-modern-card card">
    <a th:href="@{'/jobs/' + ${job.id}}" class="job-card-link">
        <div class="job-card-badges">
            <span class="badge badge--neutral" th:text="${job.departmentName}">Kỹ thuật</span>
            <span class="badge badge--success" th:text="${job.employmentType}">Full-time</span>
        </div>

        <h3 class="job-card-title" th:text="${job.postingTitle}">Senior Java Developer</h3>

        <div class="job-card-meta-list">
            <!-- Địa điểm -->
            <div class="job-card-meta-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                <span th:text="${job.workLocation != null and !job.workLocation.isEmpty() ? job.workLocation : 'Địa điểm trao đổi'}">Hà Nội</span>
            </div>

            <!-- Mức lương -->
            <div class="job-card-meta-item" th:if="${job.salaryDisplay != null}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                <span class="job-salary-highlight" th:text="${job.salaryDisplay}">25–35 triệu VND</span>
            </div>

            <!-- Hạn nộp -->
            <div class="job-card-meta-item" th:if="${job.applicationDeadline != null}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span>Hạn nộp: <strong th:text="${#temporals.format(job.applicationDeadline, 'dd/MM/yyyy')}">31/12/2026</strong></span>
            </div>
        </div>

        <div class="job-card-footer">
            <span class="job-posted-time text-muted">
                <span th:if="${job.postingDate != null}">Đăng: <time th:datetime="${job.postingDate}" th:text="${#temporals.format(job.postingDate, 'dd/MM/yyyy')}"></time></span>
                <span th:if="${job.postingDate == null}">Vị trí mới</span>
            </span>
            <span class="job-view-action text-brand">
                Xem chi tiết &rarr;
            </span>
        </div>
    </a>
</article>

<!-- =============================================================================
     2. STATCARD FRAGMENT: Thẻ số liệu đếm tổng quan Dashboard
     Cách gọi: <article th:replace="~{fragments/ui/cards :: statCard(title='Tổng ứng viên', value=${total}, detail='Tuần này')}"></article>
     ============================================================================= -->
<article th:fragment="statCard(title, value, detail)" class="dashboard-metric card">
    <h3 th:text="${title}">Chỉ số</h3>
    <p class="dashboard-value text-brand" th:text="${value}">0</p>
    <p class="dashboard-detail text-muted" th:text="${detail}">Nguồn dữ liệu</p>
</article>

</body>
</html>
