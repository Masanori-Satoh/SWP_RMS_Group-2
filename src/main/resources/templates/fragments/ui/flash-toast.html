<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Thông báo sau khi thao tác (flash): khung nổi căn giữa thanh topbar, ngang hàng tên nhân viên.
     Thanh ngang phía dưới đếm ngược 3 giây rồi tự tắt.
     Dùng chung cho Yêu cầu tuyển dụng, Tin tuyển dụng, Đề xuất nhận việc (Offer), Tài khoản, Phòng ban.
     Cần kèm css/pages/flash-toast.css + js/pages/flash-toast.js. -->
<div th:fragment="flashToast(success, error)" class="flash-toasts" th:if="${success != null or error != null}">
    <div class="flash-toast flash-toast--success" role="status" th:if="${success}" data-flash-toast>
        <span class="flash-toast-progress" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" class="flash-toast-icon"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <p class="flash-toast-text" th:text="${success}">Đã lưu thành công.</p>
        <button type="button" class="flash-toast-close" aria-label="Đóng thông báo" data-flash-close>&times;</button>
    </div>
    <div class="flash-toast flash-toast--error" role="alert" th:if="${error}" data-flash-toast>
        <span class="flash-toast-progress" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" class="flash-toast-icon"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p class="flash-toast-text" th:text="${error}">Không thể lưu.</p>
        <button type="button" class="flash-toast-close" aria-label="Đóng thông báo" data-flash-close>&times;</button>
    </div>
</div>
</body>
</html>
