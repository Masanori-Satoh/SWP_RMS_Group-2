<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- =============================================================================
     CONFIRM DIALOG FRAGMENT: Modal popup native <dialog> xác nhận hành động
     Cách gọi:
     <dialog th:replace="~{fragments/ui/dialogs :: confirm(dialogId='logoutDialog', formId='logoutForm', title='Xác nhận', message='Bạn có chắc chắn?')}"></dialog>
     ============================================================================= -->
<dialog th:fragment="confirm(dialogId, formId, title, message)"
        th:id="${dialogId}" class="confirm-dialog">
    <div class="dialog-content">
        <div class="dialog-header">
            <h3 class="dialog-title" th:text="${title}">Xác nhận hành động</h3>
        </div>
        <div class="dialog-body">
            <p th:text="${message}">Bạn có chắc chắn muốn thực hiện hành động này? Hành động này không thể hoàn tác.</p>
        </div>
        <div class="dialog-actions">
            <button type="button" class="btn btn--secondary btn--sm"
                    th:onclick="|document.getElementById('${dialogId}').close()|">
                Hủy
            </button>
            <button type="button" class="btn btn--danger btn--sm"
                    th:onclick="|document.getElementById('${formId}').submit()|">
                Xác nhận
            </button>
        </div>
    </div>
</dialog>

</body>
</html>
