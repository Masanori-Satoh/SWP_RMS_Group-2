<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENTS/SIDEBAR.HTML — cầu nối cho các trang chưa chuyển sang layout/internal
    =============================================================================
    Menu thật nằm ở fragments/layout/sidebar-shell.html + fragments/layout/sidebars/<role>.html
    (một nguồn duy nhất cho mọi trang). Fragment ở đây giữ nguyên tên + tham số cũ để
    trang cũ không phải sửa: workspace(activeMenu, role) chuyển thẳng sang shell(activeMenu, role).
    Thêm / sửa mục menu: sửa fragments/layout/sidebars/*.html, KHÔNG sửa file này.
    Trang mới: dùng layout:decorate="~{layout/internal}" (UI_NEW_PAGE.md), không gọi file này.
    =============================================================================
-->

<aside th:fragment="workspace(activeMenu, role)"
       th:replace="~{fragments/layout/sidebar-shell :: shell(${activeMenu}, ${role})}"></aside>

<!-- Fragment kế thừa / tương thích ngược -->
<aside th:fragment="sidebar(activeMenu)" th:replace="~{fragments/sidebar :: workspace(${activeMenu}, 'HR')}"></aside>

</html>
