<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
    fragments/head.html
    =====================================================================
    Fragment dùng chung cho phần <head> toàn bộ trang
    Cách dùng: <head th:replace="~{fragments/head :: head(title='Name Trang')}">

    Bao gồm:
      - Google Fonts (Inter)
      - main.css
      - Bootstrap Icons (CDN)
    =====================================================================
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recruitment Management System - Group 2 SE2064">

    <!-- Title động cho từng trang -->
    <title th:text="${title} + ' | RMS Group-2'">RMS Group-2</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Main CSS của project -->
    <link rel="stylesheet" th:href="@{/css/main.css}">

</head>
<head th:fragment="interfaceHead(title, pageStyles)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title th:text="${title} + ' | Mộc RMS'">Mộc RMS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M15 27C8 23 6 13 11 7c4-5 11-4 16-3 0 9-3 18-12 23Z' fill='%233e7157'/%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/design-tokens.css}">
    <link rel="stylesheet" th:href="@{/css/interface.css}">
    <link rel="stylesheet" th:href="@{/css/workspace.css}">
    <th:block th:replace="${pageStyles}"></th:block>
    <script defer th:src="@{/js/interface.js}"></script>
</head>
<head th:fragment="globalHead(title, pageStyles)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Mộc Careers'">Mộc Careers</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M15 27C8 23 6 13 11 7c4-5 11-4 16-3 0 9-3 18-12 23Z' fill='%233e7157'/%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <th:block th:replace="${pageStyles}"></th:block>
</head>
</html>
