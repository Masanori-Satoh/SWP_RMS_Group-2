<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="validationSummary" class="validation-summary" data-validation-summary role="alert" tabindex="-1" aria-labelledby="validation-summary-title" th:if="${#fields.hasAnyErrors()}">
  <h2 id="validation-summary-title">Check your details</h2>
  <ul><li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li></ul>
</div>
</body></html>
