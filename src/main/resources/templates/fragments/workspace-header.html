<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
    Topbar nội bộ. Góc phải lấy từ fragment dùng chung fragments/layout/topbar-user :: actions.
    Dữ liệu người dùng ưu tiên model attribute topbarUser (TopbarUserAdvice, có ở mọi trang);
    chuỗi biến cũ (dashboard, userProfile, ...) chỉ còn là phương án dự phòng.
-->
<header th:fragment="header(role, fullName)" class="workspace-header"
        th:with="userRole=${topbarUser != null and topbarUser.roleName != null ? topbarUser.roleName : (role ?: (userRole ?: (dashboard != null ? dashboard.roleName : (userProfile != null ? userProfile.roleName : (viewerRole != null ? viewerRole : (currentUser != null and currentUser instanceof T(com.group2.rms.user.entity.User) ? currentUser.role.roleName : (authenticatedUser != null ? authenticatedUser.role.roleName : (session.user != null ? session.user.role : null))))))))},
                 userName=${topbarUser != null ? topbarUser.fullName : (fullName ?: (userName ?: (dashboard != null ? dashboard.fullName : (userProfile != null ? userProfile.fullName : (viewerName != null ? viewerName : (currentUser != null and currentUser instanceof T(com.group2.rms.user.entity.User) ? currentUser.fullName : (authenticatedUser != null ? authenticatedUser.fullName : (session.user != null ? session.user.fullName : null))))))))},
                 userAvatar=${topbarUser != null ? topbarUser.avatarUrl : (avatarUrl ?: (userProfile != null ? userProfile.avatarUrl : (authenticatedUser != null ? authenticatedUser.avatarUrl : (session.user != null ? session.user.avatarUrl : null))))},
                 userEmail=${topbarUser != null ? topbarUser.email : (email ?: (userProfile != null ? userProfile.email : (dashboard != null and dashboard.candidate != null and dashboard.candidate.profile != null ? dashboard.candidate.profile.email : (authenticatedUser != null ? authenticatedUser.email : (session.user != null ? session.user.email : null)))))}">
  <a class="skip-link" href="#main">Chuyển đến nội dung chính</a>
  <a th:replace="~{fragments/brand :: wordmark('RMS')}"></a>

  <div class="workspace-header-actions">
    <!-- Nút mở menu cho màn hình di động -->
    <button class="btn btn--secondary workspace-menu" type="button" data-workspace-menu aria-controls="workspace-navigation" aria-expanded="true" hidden>Menu</button>

    <!-- Avatar + Tên + Role + Email | Đăng xuất (dùng chung với topbar công khai) -->
    <div th:replace="~{fragments/layout/topbar-user :: actions(${userName}, ${userEmail}, ${userRole}, ${userAvatar}, 'workspace')}"></div>
  </div>
</header>
</body>
</html>
