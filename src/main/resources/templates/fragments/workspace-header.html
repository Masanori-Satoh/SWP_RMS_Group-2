<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<header th:fragment="header(role, fullName)" class="workspace-header">
  <a class="skip-link" href="#main">Skip to content</a>
  <a th:replace="~{fragments/brand :: wordmark('RMS')}"></a>
  <div class="workspace-header-actions">
    <div class="workspace-identity"><strong th:if="${fullName != null}" th:text="${fullName}"></strong><span class="workspace-role" th:text="${role}"></span></div>
    <button class="btn btn-secondary workspace-menu" type="button" data-workspace-menu aria-controls="workspace-navigation" aria-expanded="true" hidden>Menu</button>
    <form th:action="@{/logout}" method="post"><button class="text-action" type="submit">Log Out</button></form>
  </div>
</header>
</body></html>
