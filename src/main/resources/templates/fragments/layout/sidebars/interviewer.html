<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="menu(activeMenu)">
    <!-- Bảng điều khiển -->
    <a th:href="@{/dashboard}" class="sidebar-nav-link"
       th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}"
       th:attr="aria-current=${activeMenu == 'dashboard' ? 'page' : null}"
       title="Bảng điều khiển"
       data-tooltip="Bảng điều khiển">
        <span class="nav-icon-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </span>
        <span class="nav-label-text">Bảng điều khiển</span>
    </a>

    <!-- Lịch phỏng vấn -->
    <a th:href="@{/interviews}" class="sidebar-nav-link"
       th:classappend="${activeMenu == 'interviews' ? 'active' : ''}"
       th:attr="aria-current=${activeMenu == 'interviews' ? 'page' : null}"
       title="Lịch phỏng vấn"
       data-tooltip="Lịch phỏng vấn">
        <span class="nav-icon-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
        </span>
        <span class="nav-label-text">Lịch phỏng vấn</span>
    </a>
</th:block>
</body>
</html>
