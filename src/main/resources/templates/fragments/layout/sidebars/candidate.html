<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Menu ứng viên (dunglt chốt 2026-10-20): Trang chủ, Việc làm đang tuyển, Đơn ứng tuyển của tôi; "Hồ sơ cá nhân" do
     sidebar-shell thêm chung. Không có dashboard riêng (/dashboard chuyển sang /portal/applications).
     Lịch phỏng vấn (/portal/interviews) và thư mời (/portal/offers) là trang con của đơn: vào từ nút trên thẻ đơn,
     và khi đang ở đó thì sáng mục "Đơn ứng tuyển của tôi". Mục menu phải khớp quyền URL trong SecurityConfig. -->
<th:block th:fragment="menu(activeMenu)">
    <!-- Trang chủ (landing công khai) -->
    <a th:href="@{/}" class="sidebar-nav-link"
       title="Trang chủ"
       data-tooltip="Trang chủ">
        <span class="nav-icon-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </span>
        <span class="nav-label-text">Trang chủ</span>
    </a>

    <!-- Việc làm đang tuyển -->
    <a th:href="@{/jobs}" class="sidebar-nav-link"
       th:classappend="${activeMenu == 'jobs' ? 'active' : ''}"
       title="Việc làm đang tuyển"
       data-tooltip="Việc làm đang tuyển">
        <span class="nav-icon-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </span>
        <span class="nav-label-text">Việc làm đang tuyển</span>
    </a>

    <!-- Đơn ứng tuyển của tôi (5.1.38, /portal/applications/** chỉ cho ứng viên); sáng cả ở trang lịch phỏng vấn, thư mời -->
    <a th:href="@{/portal/applications}" class="sidebar-nav-link"
       th:with="onMyApplications=${activeMenu == 'applications' or activeMenu == 'interviews' or activeMenu == 'offers'}"
       th:classappend="${onMyApplications ? 'active' : ''}"
       th:attr="aria-current=${onMyApplications ? 'page' : null}"
       title="Đơn ứng tuyển của tôi"
       data-tooltip="Đơn ứng tuyển của tôi">
        <span class="nav-icon-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
            </svg>
        </span>
        <span class="nav-label-text">Đơn ứng tuyển của tôi</span>
    </a>
</th:block>
</body>
</html>
