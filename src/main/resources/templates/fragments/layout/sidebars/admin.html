<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>
    <th:block th:fragment="menu(activeMenu)">
        <!-- Bảng điều khiển -->
        <a th:href="@{/dashboard}" class="sidebar-nav-link"
            th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}"
            th:attr="aria-current=${activeMenu == 'dashboard' ? 'page' : null}" title="Bảng điều khiển"
            data-tooltip="Bảng điều khiển">
            <span class="nav-icon-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
            </span>
            <span class="nav-label-text">Bảng điều khiển</span>
        </a>







        <div class="sidebar-nav-divider"></div>

        <!-- Tài khoản nội bộ -->
        <a th:href="@{/admin/accounts}" class="sidebar-nav-link"
            th:classappend="${activeMenu == 'accounts' ? 'active' : ''}"
            th:attr="aria-current=${activeMenu == 'accounts' ? 'page' : null}" title="Tài khoản nội bộ"
            data-tooltip="Tài khoản nội bộ">
            <span class="nav-icon-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
            </span>
            <span class="nav-label-text">Tài khoản nội bộ</span>
        </a>

        <!-- Tài khoản ứng viên -->
        <a th:href="@{/admin/candidate-accounts}" class="sidebar-nav-link"
            th:classappend="${activeMenu == 'candidate-accounts' ? 'active' : ''}"
            th:attr="aria-current=${activeMenu == 'candidate-accounts' ? 'page' : null}" title="Tài khoản ứng viên"
            data-tooltip="Tài khoản ứng viên">
            <span class="nav-icon-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="8.5" cy="7" r="4" />
                    <line x1="20" y1="8" x2="20" y2="14" />
                    <line x1="23" y1="11" x2="17" y2="11" />
                </svg>
            </span>
            <span class="nav-label-text">Tài khoản ứng viên</span>
        </a>

        <!-- Quản lý phòng ban -->
        <a th:href="@{/admin/departments}" class="sidebar-nav-link"
            th:classappend="${activeMenu == 'departments' ? 'active' : ''}"
            th:attr="aria-current=${activeMenu == 'departments' ? 'page' : null}" title="Quản lý phòng ban"
            data-tooltip="Quản lý phòng ban">
            <span class="nav-icon-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="2" width="16" height="20" rx="2" ry="2" />
                    <line x1="9" y1="22" x2="9" y2="2" />
                    <line x1="8" y1="6" x2="10" y2="6" />
                    <line x1="14" y1="6" x2="16" y2="6" />
                    <line x1="8" y1="10" x2="10" y2="10" />
                    <line x1="14" y1="10" x2="16" y2="10" />
                </svg>
            </span>
            <span class="nav-label-text">Quản lý phòng ban</span>
        </a>

        <!-- Giám sát API -->
        <a th:href="@{/admin/api-monitoring}" class="sidebar-nav-link"
            th:classappend="${activeMenu == 'api-monitoring' ? 'active' : ''}"
            th:attr="aria-current=${activeMenu == 'api-monitoring' ? 'page' : null}" title="Giám sát API"
            data-tooltip="Giám sát API">
            <span class="nav-icon-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="20" x2="18" y2="10" />
                    <line x1="12" y1="20" x2="12" y2="4" />
                    <line x1="6" y1="20" x2="6" y2="14" />
                </svg>
            </span>
            <span class="nav-label-text">Giám sát API</span>
        </a>
    </th:block>
</body>

</html>
