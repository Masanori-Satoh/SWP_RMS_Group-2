<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>
  <!--
    FRAGMENTS/LAYOUT/CANDIDATE-TOPBAR.HTML
    =============================================================================
    Topbar của ứng viên trong layout/internal (dunglt chốt 2026-10-20; menu thêm 2026-10-27, ux.md mục 0):
    ứng viên không có sidebar.
      Logo (về /) | Vị trí tuyển dụng · Đơn của tôi | chuông + avatar (về /portal/profile) + Đăng xuất
    Menu dùng chung với topbar công khai (fragments/layout/candidate-nav). "Đơn của tôi" sáng ở trang đơn, chi tiết
    đơn, lịch phỏng vấn (/portal/interviews) và thư mời (/portal/offers): hai trang sau mở từ nút trên thẻ đơn.
    .candidate-topbar__nav giãn (flex: 1) đẩy góc người dùng sang phải; màn hẹp xuống hàng thứ hai.
    CSS: static/css/candidate-shell.css (+ topbar.css qua workspace.css). Người dùng lấy từ topbarUser (TopbarUserAdvice).
    =============================================================================
-->
  <header th:fragment="topbar(activeMenu)" class="public-topbar candidate-topbar" th:with="viewer=${topbarUser}">
    <div class="public-topbar__inner candidate-topbar__inner">
      <a th:replace="~{fragments/brand :: wordmark('TUYỂN DỤNG')}"></a>

      <nav class="candidate-topbar__nav" aria-label="Điều hướng ứng viên"
           th:with="onMyApplications=${activeMenu == 'applications' or activeMenu == 'interviews' or activeMenu == 'offers'}">
        <th:block th:replace="~{fragments/layout/candidate-nav :: links(${onMyApplications ? 'applications' : ''})}"></th:block>
      </nav>

      <div class="public-topbar__actions">
        <div
          th:replace="~{fragments/layout/topbar-user :: actions(${viewer.fullName}, ${viewer.email}, ${viewer.roleName}, ${viewer.avatarUrl}, 'workspace')}">
        </div>
      </div>
    </div>
  </header>
</body>

</html>
