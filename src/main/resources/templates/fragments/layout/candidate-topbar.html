<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>
  <!--
    FRAGMENTS/LAYOUT/CANDIDATE-TOPBAR.HTML
    =============================================================================
    Topbar của ứng viên trong layout/internal (dunglt chốt 2026-10-20): ứng viên không có sidebar, không có menu.
      Logo (về /) | (khoảng trống) | chuông + avatar (về /profile) + Đăng xuất
    Không cần menu: logo về landing, thẻ "Bước 1" trên trang đơn dẫn tới /jobs, trang đơn là trang chính của ứng viên;
    lịch phỏng vấn (/portal/interviews) và thư mời (/portal/offers) mở từ nút trên thẻ đơn.
    .candidate-topbar__nav để trống, chỉ giữ chỗ (flex: 1) đẩy góc người dùng sang phải.
    CSS: static/css/candidate-shell.css (+ topbar.css qua workspace.css). Người dùng lấy từ topbarUser (TopbarUserAdvice).
    =============================================================================
-->
  <header th:fragment="topbar(activeMenu)" class="public-topbar candidate-topbar" th:with="viewer=${topbarUser}">
    <div class="public-topbar__inner candidate-topbar__inner">
      <a th:replace="~{fragments/brand :: wordmark('TUYỂN DỤNG')}"></a>

      <nav class="candidate-topbar__nav" aria-label="Điều hướng ứng viên">
        <!-- <a class="public-topbar__link" th:href="@{/portal/applications}"
          th:with="onMyApplications=${activeMenu == 'applications' or activeMenu == 'interviews' or activeMenu == 'offers'}"
          th:classappend="${onMyApplications} ? 'active'" th:attr="aria-current=${onMyApplications ? 'page' : null}">Đơn
          ứng tuyển của tôi</a> -->
      </nav>

      <div class="public-topbar__actions">
        <div
          th:replace="~{fragments/layout/topbar-user :: actions(${viewer.fullName}, ${viewer.email}, ${viewer.roleName}, ${viewer.avatarUrl}, 'workspace')}">
        </div>
      </div>
    </div>
  </header>
</body>

</html>
