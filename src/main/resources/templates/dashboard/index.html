<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/internal}">

<head>
    <title>Bảng điều khiển · Mộc RMS</title>
    <th:block layout:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    </th:block>
</head>

<body>
    <!-- Dashboard nội bộ: mỗi role một file trong dashboard/sections/, tên file do DTO trả về (section),
         nên template không so sánh tên role. -->
    <main id="main" layout:fragment="content" class="page-content container dash-page dash-page--recruitment adw-page" tabindex="-1">
        <th:block th:replace="~{fragments/ui/admin-workspace :: scene}"></th:block>
        <th:block th:replace="~{dashboard/sections/__${dashboard.section}__ :: content(${dashboard})}"></th:block>
    </main>
    <th:block layout:fragment="scripts">
        <th:block th:replace="~{fragments/ui/admin-workspace :: scripts}"></th:block>
        <th:block th:if="${dashboard.hasCharts()}">
            <script defer th:src="@{/js/vendor/chart.umd.min.js}"></script>
            <script defer th:src="@{/js/pages/internal-dashboard.js}"></script>
        </th:block>
    </th:block>
</body>

</html>
