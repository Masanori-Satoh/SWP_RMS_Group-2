<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Dashboard Hiring Manager; dashboard/index.html chèn vào theo dashboard.section. -->
<th:block th:fragment="content(dashboard)">
    <div th:replace="~{dashboard/fragments :: pageHeader('Bảng điều khiển', ${dashboard.scopeLabel})}"></div>

    <div class="dash-role-kpis" th:insert="~{dashboard/fragments :: kpis(${dashboard.kpis})}"></div>

    <div class="dash-split">
        <section class="card dash-panel dash-panel--priority adw-surface" aria-labelledby="hm-attention-title">
            <div class="dash-panel__heading">
                <h2 id="hm-attention-title" class="dash-panel__title">
                    <svg th:replace="~{dashboard/fragments :: icon('clipboardCheck')}"></svg>Việc cần xử lý
                </h2>
            </div>
            <p class="dash-empty" th:if="${#lists.isEmpty(dashboard.needsAttention)}">Không có việc cần xử lý.</p>
            <th:block th:unless="${#lists.isEmpty(dashboard.needsAttention)}">
                <ul th:replace="~{dashboard/fragments :: workItems(${dashboard.needsAttention})}"></ul>
            </th:block>
            <p class="dash-panel__more" th:if="${dashboard.moreNeedsAttention > 0}">
                <a class="dash-link" th:href="@{/requisitions}">Xem tất cả</a>
            </p>
        </section>

        <section class="card dash-panel adw-surface" aria-labelledby="hm-interviews-title">
            <div class="dash-panel__heading">
                <h2 id="hm-interviews-title" class="dash-panel__title">
                    <svg th:replace="~{dashboard/fragments :: icon('calendarDays')}"></svg>Lịch phỏng vấn sắp tới
                </h2>
                <a class="dash-link" th:href="@{/interviews}">Xem lịch</a>
            </div>
            <p class="dash-empty" th:if="${#lists.isEmpty(dashboard.upcomingInterviews)}">Không có lịch trong 7 ngày tới.</p>
            <th:block th:unless="${#lists.isEmpty(dashboard.upcomingInterviews)}">
                <ul th:replace="~{dashboard/fragments :: interviewList(${dashboard.upcomingInterviews})}"></ul>
            </th:block>
        </section>
    </div>

    <section class="card dash-panel adw-surface" aria-labelledby="hm-progress-title">
        <div class="dash-panel__heading">
            <h2 id="hm-progress-title" class="dash-panel__title">
                <svg th:replace="~{dashboard/fragments :: icon('target')}"></svg>Tiến độ tuyển theo vị trí
            </h2>
            <a class="dash-link" th:href="@{/requisitions}">Xem tất cả yêu cầu</a>
        </div>
        <p class="dash-empty" th:if="${#lists.isEmpty(dashboard.progress)}">Chưa có yêu cầu nào đang tuyển.</p>
        <th:block th:unless="${#lists.isEmpty(dashboard.progress)}">
            <div th:replace="~{dashboard/fragments :: chartCanvas('progress', 'dash-chart--progress')}"></div>
            <!-- Dữ liệu biểu đồ; cũng là bản đọc được khi không có JavaScript -->
            <ul class="dash-chart-data" data-chart-data>
                <li th:each="item : ${dashboard.progress}" data-chart-point
                    th:data-label="${item.title}" th:data-title="|${item.code} · ${item.title}|"
                    th:data-hired="${item.hired}" th:data-missing="${item.missing}" th:data-needed="${item.needed}"
                    th:data-note="${item.pipelineText}" th:data-href="@{${item.href}}">
                    <a class="dash-link" th:href="@{${item.href}}" th:text="|${item.code} · ${item.title}|">REQ-0001 · Vị trí</a>
                    <span th:text="|Đã tuyển ${item.hired}/${item.needed} người · ${item.pipelineText}|">Đã tuyển 1/3 người</span>
                </li>
            </ul>
        </th:block>
    </section>
</th:block>
</body>
</html>
