<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Dashboard Interviewer (chỉ lịch được phân công); dashboard/index.html chèn vào theo dashboard.section. -->
<th:block th:fragment="content(dashboard)">
    <div th:replace="~{dashboard/fragments :: pageHeader('Bảng điều khiển', null)}"></div>

    <div class="dash-role-kpis" th:insert="~{dashboard/fragments :: kpis(${dashboard.kpis})}"></div>

    <section class="card dash-panel dash-panel--priority adw-surface" aria-labelledby="iv-evaluations-title">
        <div class="dash-panel__heading">
            <h2 id="iv-evaluations-title" class="dash-panel__title">
                <svg th:replace="~{dashboard/fragments :: icon('clipboardCheck')}"></svg>Đánh giá cần hoàn thành
                <span class="dash-panel__count" th:text="|· ${#lists.size(dashboard.pendingEvaluations)}|">· 0</span>
            </h2>
        </div>
        <p class="dash-empty" th:if="${#lists.isEmpty(dashboard.pendingEvaluations)}">Bạn đã gửi đủ phiếu đánh giá.</p>
        <ul class="dash-work" th:unless="${#lists.isEmpty(dashboard.pendingEvaluations)}">
            <li th:each="evaluation : ${dashboard.pendingEvaluations}" class="dash-work__item">
                <div class="dash-work__body">
                    <p class="dash-work__title" th:text="|${evaluation.candidateName} · ${evaluation.positionTitle}|">Ứng viên · Vị trí</p>
                    <p class="dash-work__detail" th:if="${evaluation.interviewEnd != null}"
                       th:text="|Phỏng vấn ${#temporals.format(evaluation.interviewEnd, 'dd/MM HH:mm')}|">Phỏng vấn 01/01 09:00</p>
                </div>
                <a class="btn btn--secondary btn--sm" th:href="@{${evaluation.href}}">Gửi đánh giá</a>
            </li>
        </ul>
    </section>

    <section class="card dash-panel adw-surface" aria-labelledby="iv-week-title">
        <div class="dash-panel__heading">
            <div>
                <h2 id="iv-week-title" class="dash-panel__title">
                    <svg th:replace="~{dashboard/fragments :: icon('calendarDays')}"></svg>Lịch phỏng vấn
                </h2>
                <p class="dash-panel__sub"
                   th:text="|${#temporals.format(dashboard.weekStart, 'dd/MM')} – ${#temporals.format(dashboard.weekEnd, 'dd/MM/yyyy')}|">26/10 – 01/11/2026</p>
            </div>
            <nav class="dash-week-nav" aria-label="Chuyển tuần">
                <a class="btn btn--secondary btn--sm" th:href="@{/dashboard/internal(week=${dashboard.previousWeek})}"
                   aria-label="Tuần trước"><svg th:replace="~{dashboard/fragments :: icon('chevronLeft')}"></svg></a>
                <a class="btn btn--secondary btn--sm" th:href="@{/dashboard/internal}">Tuần này</a>
                <a class="btn btn--secondary btn--sm" th:href="@{/dashboard/internal(week=${dashboard.nextWeek})}"
                   aria-label="Tuần sau"><svg th:replace="~{dashboard/fragments :: icon('chevronRight')}"></svg></a>
            </nav>
        </div>
        <div class="dash-week-scroll" tabindex="0" role="region" aria-labelledby="iv-week-title">
            <ol class="dash-week">
                <li th:each="day : ${dashboard.week}" class="dash-week__day" th:classappend="${day.today ? 'dash-week__day--today' : ''}">
                    <p class="dash-week__head">
                        <span th:text="${day.weekday}">T2</span>
                        <strong th:text="${#temporals.format(day.date, 'dd/MM')}">26/10</strong>
                        <span class="dash-week__today" th:if="${day.today}">Hôm nay</span>
                    </p>
                    <p class="dash-week__empty" th:if="${#lists.isEmpty(day.interviews)}">Không có lịch</p>
                    <a th:each="interview : ${day.interviews}" class="dash-week__slot"
                       th:classappend="${interview.finished ? 'dash-week__slot--done' : ''}"
                       th:href="@{${interview.href}}">
                        <strong th:text="${#temporals.format(interview.startTime, 'HH:mm')}">09:00</strong>
                        <span class="dash-week__name" th:text="${interview.candidateName}">Ứng viên</span>
                        <span th:text="${interview.positionTitle}">Vị trí</span>
                        <span th:text="${interview.location ?: interview.formatLabel}">Nơi</span>
                    </a>
                </li>
            </ol>
        </div>
    </section>
</th:block>
</body>
</html>
