<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<!-- Linh kiện dùng chung của dashboard nội bộ (dashboard/sections/*). Không có JavaScript, không style inline. -->

<!-- Icon nét mảnh dùng chung cho dashboard nội bộ. Mỗi tên chọn một path SVG tĩnh. -->
<svg th:fragment="icon(name)" class="dash-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"
     th:switch="${name}">
    <path th:case="'file'" d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7ZM14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"></path>
    <path th:case="'fileCheck'" d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7ZM14 2v4a2 2 0 0 0 2 2h4M9 15l2 2 4-4"></path>
    <path th:case="'target'" d="M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20M12 6a6 6 0 1 0 0 12a6 6 0 1 0 0-12M12 10a2 2 0 1 0 0 4a2 2 0 1 0 0-4"></path>
    <path th:case="'clock'" d="M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20M12 6v6l4 2"></path>
    <path th:case="'calendar'" d="M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 2v4M16 2v4M3 10h18"></path>
    <path th:case="'calendarCheck'" d="M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 2v4M16 2v4M3 10h18M9 16l2 2 4-4"></path>
    <path th:case="'calendarDays'" d="M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 2v4M16 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"></path>
    <path th:case="'filter'" d="M22 3H2l8 9.46V19l4 2v-8.54z"></path>
    <path th:case="'alert'" d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3ZM12 9v4M12 17h.01"></path>
    <path th:case="'inbox'" d="M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
    <path th:case="'banknote'" d="M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM12 10a2 2 0 1 0 0 4a2 2 0 1 0 0-4M6 12h.01M18 12h.01"></path>
    <path th:case="'userCheck'" d="m16 11 2 2 4-4M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 3a4 4 0 1 0 0 8a4 4 0 1 0 0-8"></path>
    <path th:case="'percent'" d="M19 5 5 19M6.5 4a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5M17.5 15a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5"></path>
    <path th:case="'clipboardCheck'" d="M9 2h6a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2m1 10 2 2 4-4"></path>
    <path th:case="'send'" d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11zM21.854 2.147l-10.94 10.939"></path>
    <path th:case="'eye'" d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6"></path>
    <path th:case="'chartBar'" d="M3 3v16a2 2 0 0 0 2 2h16M7 16h8M7 11h12M7 6h3"></path>
    <path th:case="'chartColumnIncreasing'" d="M13 17V9M18 17V5M3 3v16a2 2 0 0 0 2 2h16M8 17v-3"></path>
    <path th:case="'briefcaseBusiness'" d="M12 12h.01M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M22 13a18.15 18.15 0 0 1-20 0M4 6h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"></path>
    <path th:case="'building'" d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18ZM6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2M10 6h4M10 10h4M10 14h4M10 18h4"></path>
    <path th:case="'history'" d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5M12 7v5l4 2"></path>
    <path th:case="'chevronLeft'" d="m15 18-6-6 6-6"></path>
    <path th:case="'chevronRight'" d="m9 18 6-6-6-6"></path>
</svg>

<!-- Tiêu đề trang: lời chào + phạm vi số liệu -->
<div th:fragment="pageHeader(title, scope)" class="page-header dash-page-header">
    <div>
        <h1 class="page-title" th:text="${title}">Bảng điều khiển</h1>
        <p class="page-subtitle" th:text="${scope}">Phạm vi</p>
    </div>
</div>

<!-- 4 thẻ KPI bấm được: ô icon, nhãn, con số, % so với kỳ trước, 1 dòng phụ -->
<section th:fragment="kpis(items)" class="dash-kpis" aria-label="Số liệu tổng quan">
    <a th:each="kpi : ${items}" class="card dash-kpi" th:classappend="|dash-kpi--${kpi.tone}|" th:href="@{${kpi.href}}">
        <span class="dash-kpi__icon"><svg th:replace="~{dashboard/fragments :: icon(${kpi.icon})}"></svg></span>
        <span class="dash-kpi__body">
            <span class="dash-kpi__label" th:text="${kpi.title}">Chỉ số</span>
            <span class="dash-kpi__value-row">
                <strong class="dash-kpi__value" th:text="${kpi.value}">0</strong>
                <span class="dash-kpi__delta" th:if="${kpi.delta != null}"
                      th:classappend="|dash-kpi__delta--${kpi.deltaTone}|" th:text="${kpi.delta}">↑ 0%</span>
            </span>
            <span class="dash-kpi__detail" th:text="${kpi.detail}">Dòng phụ</span>
        </span>
    </a>
</section>

<!-- Biểu đồ thanh ngang: độ dài thanh vẽ bằng thẻ progress; note = chữ phụ tô màu (ví dụ "3 chờ quá 3 ngày") -->
<ul th:fragment="barChart(bars)" class="dash-bars">
    <li th:each="bar : ${bars}">
        <a class="dash-bars__row" th:href="@{${bar.href}}" th:title="${bar.hint}">
            <span class="dash-bars__label" th:text="${bar.label}">Giai đoạn</span>
            <progress class="dash-bars__meter" aria-hidden="true" th:value="${bar.count}"
                      th:max="${bar.max > 0 ? bar.max : 1}"></progress>
            <span class="dash-bars__value">
                <strong th:text="${bar.count}">0</strong>
                <span th:if="${bar.note != null}" class="dash-bars__note" th:classappend="|dash-bars__note--${bar.noteTone}|"
                      th:text="${bar.note}">0 quá hạn</span>
            </span>
        </a>
    </li>
</ul>

<!-- Biểu đồ cột dọc theo tuần: chiều cao theo bậc 0..10 (class dash-col-h{n}), không style inline.
     Không dùng "__" trong biểu thức th:classappend: Thymeleaf hiểu __...__ là tiền xử lý. -->
<ol th:fragment="columnChart(columns, label)" class="dash-columns" th:aria-label="${label}">
    <li th:each="column : ${columns}" class="dash-columns__item" th:title="${column.hint}">
        <strong class="dash-columns__count" th:text="${column.count}">0</strong>
        <span class="dash-columns__bar" aria-hidden="true"
              th:classappend="${'dash-col-h' + column.level + (column.current ? ' dash-col-current' : '')}"></span>
        <span class="dash-columns__label" th:text="${column.label}">01/09</span>
    </li>
</ol>

<!-- Danh sách việc cần xử lý: nội dung bên trái; thời gian chờ, loại việc, nút bên phải -->
<ul th:fragment="workItems(items)" class="dash-work">
    <li th:each="item : ${items}" class="dash-work__item">
        <div class="dash-work__body">
            <p class="dash-work__title" th:text="${item.title}">Tiêu đề</p>
            <p class="dash-work__detail" th:if="${item.detail != null}" th:text="${item.detail}">Chi tiết</p>
        </div>
        <span th:if="${item.waitText != null}" class="badge" th:classappend="|badge--${item.waitTone}|">
            <span class="sr-only">Đã chờ </span><span th:text="${item.waitText}">0 ngày</span>
        </span>
        <span class="badge" th:classappend="|badge--${item.tagTone}|" th:text="${item.tag}">Loại</span>
        <a class="btn btn--sm" th:classappend="${item.primary ? 'btn--primary' : 'btn--secondary'}"
           th:href="@{${item.href}}" th:text="${item.actionLabel}">Mở</a>
    </li>
</ul>

<!-- Lịch phỏng vấn dạng danh sách: ô giờ bên trái, ứng viên + vị trí bên phải -->
<ul th:fragment="interviewList(items)" class="dash-interviews">
    <li th:each="interview : ${items}" class="dash-interviews__item">
        <span class="dash-interviews__time">
            <span th:text="${#temporals.format(interview.startTime, 'dd/MM')}">01/01</span>
            <strong th:text="${#temporals.format(interview.startTime, 'HH:mm')}">09:00</strong>
        </span>
        <span class="dash-interviews__body">
            <strong th:text="${interview.candidateName}">Ứng viên</strong>
            <span class="dash-interviews__meta"
                  th:text="|${interview.positionTitle} · ${interview.location ?: interview.formatLabel}|">Vị trí · Hình thức</span>
        </span>
        <span class="badge" th:classappend="|badge--${interview.stateTone}|" th:text="${interview.stateLabel}">Đã lên lịch</span>
    </li>
</ul>

</body></html>
