<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<!-- Presentation labels belong to the Dashboard views. Persisted data and DTO keys stay unchanged. -->
<section th:fragment="metrics(items)" class="dashboard-grid" aria-label="Số liệu tổng quan"
         th:with="titles=${ {'Open Job Postings':'Tin đang tuyển', 'Total Applications':'Tổng hồ sơ ứng tuyển', 'Upcoming Interviews':'Phỏng vấn sắp tới', 'New Applications Awaiting HR Review':'Hồ sơ chờ nhân sự duyệt', 'Requisitions Awaiting Approval':'Yêu cầu chờ phê duyệt', 'Offers Awaiting Approval':'Đề nghị chờ phê duyệt', 'Upcoming Assigned Interviews':'Phỏng vấn được phân công', 'Assigned Candidates':'Ứng viên được phân công', 'Pending Interview Evaluations':'Đánh giá còn chờ'} },
                  details=${ {'Open Job Postings':'Đã đăng và còn hạn nhận hồ sơ', 'Total Applications':'Hồ sơ trong toàn bộ quy trình tuyển dụng', 'Upcoming Interviews':'Lịch đã hẹn hoặc được đổi lịch trong phạm vi của bạn', 'New Applications Awaiting HR Review':'Hồ sơ mới nộp, chưa được nhân sự duyệt', 'Requisitions Awaiting Approval':'Yêu cầu đang chờ duyệt trên toàn hệ thống', 'Offers Awaiting Approval':'Đề nghị đang chờ duyệt trên toàn hệ thống', 'Upcoming Assigned Interviews':'Lịch bạn tham gia trong hội đồng phỏng vấn', 'Assigned Candidates':'Số ứng viên trong các lịch bạn được phân công', 'Pending Interview Evaluations':'Phỏng vấn đã hoàn tất, chưa có đánh giá của bạn'} }">
    <th:block th:each="metric : ${items}">
        <article th:replace="~{fragments/ui/cards :: statCard(title=${titles[metric.title] ?: metric.title}, value=${metric.value}, detail=${details[metric.title] ?: metric.detail})}"></article>
    </th:block>
</section>

<section th:fragment="statuses(title, items)" class="dash-section">
    <h2 class="dash-section__title" th:text="${title}">Trạng thái</h2>
    <p class="dash-empty" th:if="${#lists.isEmpty(items)}">Chưa có dữ liệu để thống kê.</p>
    <th:block th:unless="${#lists.isEmpty(items)}"><dl th:replace="~{dashboard/fragments :: statusRows(${items})}"></dl></th:block>
</section>
<!-- dunglt bổ sung: nhãn Hired "Đã nhận việc", khớp ApplicationStatusLabels và DashboardService -->
<dl th:fragment="statusRows(items)" class="dash-statuses"
        th:with="labels=${ {'Applied':'Đã nộp hồ sơ', 'AI_Screened':'Đã sàng lọc', 'HR_Passed':'Qua vòng nhân sự', 'HM_Passed':'Qua vòng chuyên môn', 'Interviewing':'Đang phỏng vấn', 'Offered':'Đã có thư mời', 'Hired':'Đã nhận việc', 'Rejected':'Không tiếp tục', 'OPERATIONAL':'Hoạt động', 'FAILED':'Có lỗi', 'NOT_CHECKED':'Chưa kiểm tra', 'Not check':'Chưa kiểm tra', 'UNCONFIGURED':'Chưa cấu hình', 'Unconfigured':'Chưa cấu hình'} }">
        <div th:each="item : ${items}"><dt th:text="${labels[item.status] ?: item.status}">Trạng thái</dt><dd th:text="${item.count}">0</dd></div>
</dl>
<!-- ===== Fragment cho dashboard theo role mới (Hiring Manager trước, các role khác dùng lại) ===== -->

<!-- Thẻ KPI bấm được; tone (neutral / warning / danger) tô viền trái -->
<section th:fragment="kpis(items)" class="dashboard-grid" aria-label="Số liệu tổng quan">
    <a th:each="kpi : ${items}" class="dashboard-metric card dash-kpi" th:classappend="|dash-kpi--${kpi.tone}|"
       th:href="@{${kpi.href}}">
        <h3 th:text="${kpi.title}">Chỉ số</h3>
        <p class="dashboard-value text-brand" th:text="${kpi.value}">0</p>
        <p class="dashboard-detail text-muted" th:text="${kpi.detail}">Giải thích</p>
    </a>
</section>

<!-- Biểu đồ thanh ngang: độ dài thanh vẽ bằng thẻ progress (không cần JS, không style inline) -->
<section th:fragment="barChart(chart, chartId)" class="card dash-bars" th:aria-labelledby="${chartId}">
    <h3 class="dash-chart-title" th:id="${chartId}" th:text="${chart.title}">Biểu đồ</h3>
    <p class="dash-chart-description" th:text="${chart.scope}">Phạm vi</p>
    <ul class="dash-bars__list">
        <li th:each="bar : ${chart.bars}">
            <a class="dash-bars__row" th:href="@{${bar.href}}">
                <span class="dash-bars__label" th:text="${bar.label}">Trạng thái</span>
                <progress class="dash-bars__meter" aria-hidden="true" th:value="${bar.count}"
                          th:max="${bar.max > 0 ? bar.max : 1}"></progress>
                <strong class="dash-bars__count" th:text="${bar.count}">0</strong>
            </a>
        </li>
    </ul>
</section>

<!-- Danh sách việc cần xử lý: mỗi việc một dòng — nội dung bên trái; thời gian chờ, trạng thái, nút bên phải -->
<ul th:fragment="workItems(items)" class="dash-work">
    <li th:each="item : ${items}" class="dash-work__item">
        <div class="dash-work__body">
            <p class="dash-work__title" th:text="${item.title}">Tiêu đề</p>
            <p class="dash-work__detail text-muted" th:if="${item.detail != null}" th:text="${item.detail}">Chi tiết</p>
        </div>
        <span th:if="${item.waitText != null}" class="badge" th:classappend="|badge--${item.waitTone}|">
            <span class="sr-only">Đã chờ </span><span th:text="${item.waitText}">0 ngày</span>
        </span>
        <span class="badge" th:classappend="|badge--${item.tagTone}|" th:text="${item.tag}">Loại</span>
        <a class="btn btn--secondary btn--sm" th:href="@{${item.href}}" th:text="${item.actionLabel}">Mở</a>
    </li>
</ul>

</body></html>
