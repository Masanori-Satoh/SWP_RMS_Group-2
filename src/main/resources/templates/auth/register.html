<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{auth/fragments :: head('Đăng ký ứng viên')}"></head>
<body class="auth-page auth-botanical auth-register">
<header th:replace="~{auth/fragments :: header}"></header>
<div class="auth-stage">
<div th:replace="~{auth/fragments :: scene}"></div>
<div class="auth-container auth-shell">
  <aside th:replace="~{auth/fragments :: story(botanical=true)}"></aside>
  <main id="main" class="card auth-card" tabindex="-1">
    <nav th:replace="~{auth/fragments :: registrationSteps(1)}"></nav>
    <h1>Tạo tài khoản ứng viên.</h1>
    <p class="auth-intro">Điền thông tin để nhận mã xác minh qua email.<br>Tài khoản chỉ được tạo sau khi bạn xác minh mã thành công.</p>
    <form class="auth-form auth-register-grid" th:action="@{/register}" th:object="${form}" method="post" data-auth-form>
      <div th:replace="~{auth/fragments :: errors}"></div>
      <div class="auth-field">
        <label class="form-label" for="full-name">Họ và tên</label>
        <div class="auth-input-wrap"><svg th:replace="~{auth/fragments :: icon('user')}"></svg><input class="form-input" id="full-name" type="text" th:field="*{fullName}" placeholder="Nhập họ và tên" maxlength="100" autocomplete="name" required th:attr="aria-invalid=${#fields.hasErrors('fullName')},aria-describedby=${#fields.hasErrors('fullName') ? 'full-name-error' : null}"></div>
        <span id="full-name-error" class="form-error auth-field-error" th:if="${#fields.hasErrors('fullName')}" ><th:block th:replace="~{auth/fragments :: fieldErrors('fullName')}"></th:block></span>
      </div>
      <div class="auth-field">
        <label class="form-label" for="username">Tên đăng nhập</label>
        <div class="auth-input-wrap"><svg th:replace="~{auth/fragments :: icon('user')}"></svg><input class="form-input" id="username" type="text" th:field="*{username}" placeholder="Nhập tên đăng nhập" maxlength="50" autocomplete="username" autocapitalize="none" spellcheck="false" required th:attr="aria-invalid=${#fields.hasErrors('username')},aria-describedby=${#fields.hasErrors('username') ? 'username-hint username-error' : 'username-hint'}"></div>
        <small id="username-hint" class="form-hint auth-hint auth-visually-hidden">Tên đăng nhập không thể thay đổi.</small>
        <span id="username-error" class="form-error auth-field-error" th:if="${#fields.hasErrors('username')}" ><th:block th:replace="~{auth/fragments :: fieldErrors('username')}"></th:block></span>
      </div>
      <div class="auth-field auth-field--wide">
        <label class="form-label" for="email">Email</label>
        <div class="auth-input-wrap"><svg th:replace="~{auth/fragments :: icon('mail')}"></svg><input class="form-input" id="email" type="email" th:field="*{email}" placeholder="Nhập email của bạn" maxlength="150" autocomplete="email" autocapitalize="none" spellcheck="false" required th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email') ? 'email-error' : null}"></div>
        <span id="email-error" class="form-error auth-field-error" th:if="${#fields.hasErrors('email')}" ><th:block th:replace="~{auth/fragments :: fieldErrors('email')}"></th:block></span>
      </div>
      <div class="auth-field">
        <label class="form-label" for="password">Mật khẩu</label>
        <div class="auth-password">
          <svg th:replace="~{auth/fragments :: icon('lock')}"></svg>
          <input class="form-input" id="password" type="password" name="password" placeholder="Nhập mật khẩu" minlength="8" maxlength="32" autocomplete="new-password" required th:attr="aria-invalid=${#fields.hasErrors('password')},aria-describedby=${#fields.hasErrors('password') ? 'password-hint password-error' : 'password-hint'}">
          <button class="auth-password-toggle" type="button" data-password-toggle aria-controls="password" aria-label="Hiện mật khẩu" data-show-label="Hiện mật khẩu" data-hide-label="Ẩn mật khẩu" aria-pressed="false" hidden><svg th:replace="~{auth/fragments :: icon('eye')}"></svg><span class="auth-visually-hidden" data-password-toggle-label>Hiện</span></button>
        </div>
        <small id="password-hint" class="form-hint auth-hint">Sử dụng từ 8 đến 32 ký tự.</small>
        <span id="password-error" class="form-error auth-field-error" th:if="${#fields.hasErrors('password')}" ><th:block th:replace="~{auth/fragments :: fieldErrors('password')}"></th:block></span>
      </div>
      <div class="auth-field">
        <label class="form-label" for="confirm-password">Xác nhận mật khẩu</label>
        <div class="auth-password">
          <svg th:replace="~{auth/fragments :: icon('lock')}"></svg>
          <input class="form-input" id="confirm-password" type="password" name="confirmPassword" placeholder="Nhập lại mật khẩu" minlength="8" maxlength="32" autocomplete="new-password" required th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')},aria-describedby=${#fields.hasErrors('confirmPassword') ? 'confirm-password-error' : null}">
          <button class="auth-password-toggle" type="button" data-password-toggle aria-controls="confirm-password" aria-label="Hiện mật khẩu xác nhận" data-show-label="Hiện mật khẩu xác nhận" data-hide-label="Ẩn mật khẩu xác nhận" aria-pressed="false" hidden><svg th:replace="~{auth/fragments :: icon('eye')}"></svg><span class="auth-visually-hidden" data-password-toggle-label>Hiện</span></button>
        </div>
        <span id="confirm-password-error" class="form-error auth-field-error" th:if="${#fields.hasErrors('confirmPassword')}" ><th:block th:replace="~{auth/fragments :: fieldErrors('confirmPassword')}"></th:block></span>
      </div>
      <p class="auth-cooldown" th:if="${retryAfterSeconds != null and retryAfterSeconds > 0}">Bạn có thể gửi mã mới sau <span data-retry-countdown th:attr="data-retry-after-seconds=${retryAfterSeconds}" th:text="${(#numbers.formatInteger(retryAfterSeconds / 60, 1)) + ':' + #numbers.formatInteger(retryAfterSeconds % 60, 2)}"></span>.</p>
      <button class="btn btn--primary auth-submit" type="submit" data-auth-submit data-resend-submit data-busy-label="Đang gửi mã…" th:disabled="${retryAfterSeconds != null and retryAfterSeconds > 0}"><span data-auth-submit-label>Gửi mã xác minh</span><svg th:replace="~{auth/fragments :: icon('arrow')}"></svg></button>
    </form>
    <nav class="auth-links auth-divider" aria-label="Tài khoản đã có"><span>Bạn đã có tài khoản?</span><a th:href="@{/login}">Đăng nhập</a></nav>
  </main>
</div>
</div>
<footer th:replace="~{auth/fragments :: footer}"></footer>
</body>
</html>
