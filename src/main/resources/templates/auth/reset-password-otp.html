<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{auth/fragments :: head('Xác minh mã OTP')}"></head>
<body class="auth-page">
<header th:replace="~{auth/fragments :: header}"></header>
<div class="auth-container auth-shell">
  <aside th:replace="~{auth/fragments :: story}"></aside>
  <main id="main" class="auth-card" tabindex="-1">
    <nav th:replace="~{auth/fragments :: resetSteps(2)}"></nav>
    <h1>Nhập mã xác minh.</h1>
    <p class="auth-intro">Nhập mã gồm 6 chữ số đã gửi đến email tài khoản. Mã có hiệu lực trong 15 phút kể từ khi gửi.</p>
    <form class="auth-form" th:action="@{/reset-password/otp}" th:object="${form}" method="post" data-auth-form>
      <div th:replace="~{auth/fragments :: errors}"></div>
      <div class="auth-field">
        <label id="otp-label" for="otp">Mã xác minh</label>
        <input id="otp" class="auth-otp" type="text" name="otp" data-otp-value minlength="6" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" required th:attr="aria-invalid=${#fields.hasErrors('otp')},aria-describedby=${#fields.hasErrors('otp') ? 'otp-hint otp-error' : 'otp-hint'}">
        <div class="auth-otp-boxes" data-otp-boxes role="group" aria-labelledby="otp-label" hidden th:attr="aria-describedby=${#fields.hasErrors('otp') ? 'otp-hint otp-error' : 'otp-hint'}">
          <div class="auth-otp-cell" th:each="digit : ${#numbers.sequence(1, 6)}">
            <label class="auth-visually-hidden" th:for="${'otp-digit-' + digit}" th:text="${'Chữ số ' + digit + ' trên 6'}"></label>
            <input class="auth-otp-digit" type="text" data-otp-digit inputmode="numeric" pattern="[0-9]" autocapitalize="none" spellcheck="false" th:id="${'otp-digit-' + digit}" th:attr="maxlength=${digit == 1 ? 6 : 1},autocomplete=${digit == 1 ? 'one-time-code' : 'off'},aria-invalid=${#fields.hasErrors('otp')},aria-describedby=${#fields.hasErrors('otp') ? 'otp-hint otp-error' : 'otp-hint'}">
          </div>
        </div>
        <small id="otp-hint" class="auth-hint">Nhập hoặc dán đầy đủ 6 chữ số.</small>
        <span id="otp-error" class="auth-field-error" th:if="${#fields.hasErrors('otp')}" ><th:block th:replace="~{auth/fragments :: fieldErrors('otp')}"></th:block></span>
      </div>
      <button class="button auth-submit" type="submit" data-auth-submit data-busy-label="Đang xác minh…">Xác minh mã</button>
    </form>
    <div class="auth-support">
      <p>Nếu chưa nhận được email, hãy kiểm tra thư rác.</p>
      <form class="auth-resend" th:action="@{/forgot-password}" method="post" data-auth-form>
        <input type="hidden" name="email" th:value="${pendingResetEmail}">
        <p class="auth-cooldown" th:if="${retryAfterSeconds > 0}">Gửi lại mã sau <span data-retry-countdown th:attr="data-retry-after-seconds=${retryAfterSeconds}" th:text="${(#numbers.formatInteger(retryAfterSeconds / 60, 1)) + ':' + #numbers.formatInteger(retryAfterSeconds % 60, 2)}"></span>.</p>
        <p class="auth-cooldown" th:unless="${retryAfterSeconds > 0}">Bạn có thể yêu cầu gửi lại mã xác minh.</p>
        <button class="auth-resend-button" type="submit" data-auth-submit data-resend-submit data-busy-label="Đang gửi lại…" th:disabled="${retryAfterSeconds > 0}">Gửi lại mã xác minh</button>
      </form>
    </div>
    <noscript><p class="auth-hint">Để cập nhật thời gian gửi lại, hãy <a th:href="@{/reset-password/otp}">tải lại trang</a>.</p></noscript>
    <nav class="auth-links auth-divider" aria-label="Khôi phục mật khẩu"><a th:href="@{/login}">Về trang đăng nhập</a></nav>
  </main>
</div>
<footer th:replace="~{auth/fragments :: footer}"></footer>
</body>
</html>
