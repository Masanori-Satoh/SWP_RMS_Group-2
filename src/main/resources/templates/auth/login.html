<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | RMS</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <h1>Đăng nhập</h1>
    <p class="auth-message auth-error" th:if="${param.error}">Tên đăng nhập hoặc mật khẩu không đúng, hoặc tài khoản không hoạt động.</p>
    <p class="auth-message" th:if="${param.logout}">Đăng xuất thành công.</p>
    <p class="auth-message" th:if="${param.registered}">Tạo tài khoản thành công. Vui lòng đăng nhập.</p>
    <p class="auth-message" th:if="${param.reset}">Đặt lại mật khẩu thành công. Vui lòng đăng nhập.</p>
    <p class="auth-message auth-error" th:if="${param['session-expired']}">Phiên đã hết hiệu lực. Vui lòng đăng nhập lại.</p>
    <form th:action="@{/login}" method="post">
        <label for="username">Tên đăng nhập hoặc email</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
        <button type="submit">Đăng nhập</button>
    </form>
    <nav class="auth-links" aria-label="Tài khoản">
        <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
        <a th:href="@{/register}">Đăng ký tài khoản Candidate</a>
    </nav>
</main>
</body>
</html>
