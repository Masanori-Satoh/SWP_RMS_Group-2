<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu | RMS</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <h1>Quên mật khẩu</h1>
    <p class="auth-intro">Nhập email của tài khoản. Liên kết xác minh email và đặt lại mật khẩu có hiệu lực 15 phút.</p>
    <p class="auth-message" role="status" th:if="${param.sent}">Nếu email thuộc một tài khoản đang hoạt động, yêu cầu khôi phục đã được tiếp nhận. Hãy kiểm tra hộp thư và thử lại sau nếu chưa nhận được.</p>
    <form th:action="@{/forgot-password}" th:object="${form}" method="post">
        <div class="auth-message auth-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        </div>
        <label for="email">Email đã đăng ký</label>
        <input id="email" type="email" th:field="*{email}" maxlength="150" autocomplete="email" required>
        <span class="auth-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        <button type="submit">Gửi liên kết xác minh</button>
    </form>
    <nav class="auth-links auth-links-single"><a th:href="@{/login}">Quay lại đăng nhập</a></nav>
</main>
</body>
</html>
