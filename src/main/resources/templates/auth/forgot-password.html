<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{auth/fragments :: head('Quên mật khẩu')}"></head>
<body class="auth-page">
<header th:replace="~{auth/fragments :: header}"></header>
<div class="auth-container auth-shell">
  <aside th:replace="~{auth/fragments :: story}"></aside>
  <main id="main" class="auth-card" tabindex="-1">
    <nav th:replace="~{auth/fragments :: resetSteps(1)}"></nav>
    <h1>Bạn quên mật khẩu?</h1>
    <p class="auth-intro">Nhập email tài khoản. Chúng tôi sẽ gửi mã gồm 6 chữ số để bạn đặt lại mật khẩu.</p>
    <p class="auth-message" role="status" th:if="${param.sent}">Kiểm tra hộp thư để lấy mã xác minh. Mã có hiệu lực trong 15 phút kể từ khi gửi.</p>
    <form class="auth-form" th:action="@{/forgot-password}" th:object="${form}" method="post" data-auth-form>
      <div th:replace="~{auth/fragments :: errors}"></div>
      <div class="auth-field">
        <label for="email">Email tài khoản</label>
        <input id="email" type="email" th:field="*{email}" maxlength="150" autocomplete="email" autocapitalize="none" spellcheck="false" required th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email') ? 'email-error' : null}">
        <span id="email-error" class="auth-field-error" th:if="${#fields.hasErrors('email')}" ><th:block th:replace="~{auth/fragments :: fieldErrors('email')}"></th:block></span>
      </div>
      <p class="auth-cooldown" th:if="${retryAfterSeconds != null and retryAfterSeconds > 0}">Bạn có thể yêu cầu gửi lại mã sau <span data-retry-countdown th:attr="data-retry-after-seconds=${retryAfterSeconds}" th:text="${retryAfterSeconds + ' giây'}"></span>.</p>
      <button class="button auth-submit" type="submit" data-auth-submit data-busy-label="Đang gửi mã…">Gửi mã xác minh</button>
    </form>
    <nav class="auth-links auth-divider" aria-label="Khôi phục mật khẩu"><a th:href="@{/login}">Về trang đăng nhập</a></nav>
  </main>
</div>
<footer th:replace="~{auth/fragments :: footer}"></footer>
</body>
</html>
