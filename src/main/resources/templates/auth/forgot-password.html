<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: interfaceHead('Forgot Password', ~{::pageStyles})}">
  <th:block th:fragment="pageStyles">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <style>
      html {
        height: 100%;
        min-height: 100%;
      }
      body.auth-page {
        min-height: 100vh !important;
        min-height: 100% !important;
        display: grid !important;
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr) !important;
        grid-template-rows: minmax(100vh, 1fr) !important;
        margin: 0 !important;
      }
      .auth-brand-panel {
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        min-height: 100vh !important;
        min-height: 100% !important;
        height: 100% !important;
        box-sizing: border-box !important;
        overflow-y: auto;
      }
      .auth-story {
        display: block !important;
        margin-block: auto;
      }
      .auth-brand-foot {
        display: block !important;
      }
      .auth-card {
        width: min(440px, calc(100% - 32px)) !important;
        max-width: 440px;
        align-self: safe center !important;
        justify-self: center !important;
        margin-block: auto !important;
        box-sizing: border-box;
      }
      .auth-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
      }
      .auth-links a {
        min-height: 36px;
        line-height: 1.4;
      }
    </style>
  </th:block>
</head>
<body class="auth-page">
<a class="skip-link" href="#main">Skip to content</a>
<aside th:replace="~{fragments/auth-layout :: brandPanel}"></aside>
<main id="main" class="auth-card" tabindex="-1">
    <h1>Forgot Password</h1>
    <p class="auth-intro">Enter your account email. The verification and password reset link expires after 15 minutes.</p>
    <p class="auth-message" role="status" th:if="${param.sent}">If this email belongs to an active account, the recovery request has been received. Check your inbox and try again later if no email arrives.</p>
    <form th:action="@{/forgot-password}" th:object="${form}" method="post">
        <div th:replace="~{fragments/messages :: validationSummary}"></div>
        <label for="email">Registered Email <span aria-hidden="true">*</span></label>
        <input id="email" type="email" th:field="*{email}" maxlength="150" autocomplete="email" required th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email') ? 'email-error' : null}">
        <span id="email-error" class="auth-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        <button class="btn btn-primary" type="submit">Send Verification Link</button>
    </form>
    <nav class="auth-links auth-links-single"><a th:href="@{/login}">Back to Sign In</a></nav>
</main>
</body>
</html>
