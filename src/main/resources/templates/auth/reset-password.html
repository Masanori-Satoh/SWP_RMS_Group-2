<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: interfaceHead('Reset Password', ~{::pageStyles})}">
    <th:block th:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/auth.css}">
        <style>
          html {
            height: 100%;
            min-height: 100%;
          }
          body.auth-page {
            min-height: 100vh !important;
            min-height: 100% !important;
            display: grid !important;
            grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr) !important;
            grid-template-rows: minmax(100vh, 1fr) !important;
            margin: 0 !important;
          }
          .auth-brand-panel {
            display: flex !important;
            flex-direction: column !important;
            justify-content: space-between !important;
            min-height: 100vh !important;
            min-height: 100% !important;
            height: 100% !important;
            box-sizing: border-box !important;
            overflow-y: auto;
          }
          .auth-story {
            display: block !important;
            margin-block: auto;
          }
          .auth-brand-foot {
            display: block !important;
          }
          .auth-card {
            width: min(440px, calc(100% - 32px)) !important;
            max-width: 440px;
            align-self: safe center !important;
            justify-self: center !important;
            margin-block: auto !important;
            box-sizing: border-box;
          }
          .auth-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            align-items: center;
          }
          .auth-links a {
            min-height: 36px;
            line-height: 1.4;
          }
        </style>
    </th:block>
</head>

<body class="auth-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <aside th:replace="~{fragments/auth-layout :: brandPanel}"></aside>
    <main id="main" class="auth-card" tabindex="-1">
        <h1>Reset Password</h1>
        <p class="auth-message auth-error" role="alert" th:unless="${validToken}">This link is invalid, used, or
            expired. Request a new link.</p>
        <th:block th:if="${validToken}">
            <p class="auth-intro">Enter the 6-digit OTP code from your email and choose a new password of 8–32
                characters.</p>
            <form th:action="@{/reset-password/{token}(token=${token})}" th:object="${form}" method="post">
                <div th:replace="~{fragments/messages :: validationSummary}"></div>

                <label for="otp">Verification Code (OTP) <span aria-hidden="true">*</span></label>
                <input id="otp" type="text" th:field="*{otp}" minlength="6" maxlength="6" pattern="\d{6}"
                    inputmode="numeric" autocomplete="one-time-code" required
                    th:attr="aria-invalid=${#fields.hasErrors('otp')},aria-describedby=${#fields.hasErrors('otp') ? 'otp-error' : null}">
                <span id="otp-error" class="auth-field-error" th:if="${#fields.hasErrors('otp')}"
                    th:errors="*{otp}"></span>

                <label for="password">New Password <span aria-hidden="true">*</span></label>
                <input id="password" type="password" name="password" minlength="8" maxlength="32"
                    autocomplete="new-password" required
                    th:attr="aria-invalid=${#fields.hasErrors('password')},aria-describedby=${#fields.hasErrors('password') ? 'password-error' : null}">
                <span id="password-error" class="auth-field-error" th:if="${#fields.hasErrors('password')}"
                    th:errors="*{password}"></span>
                <label for="confirm-password">Confirm New Password <span aria-hidden="true">*</span></label>
                <input id="confirm-password" type="password" name="confirmPassword" minlength="8" maxlength="32"
                    autocomplete="new-password" required
                    th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')},aria-describedby=${#fields.hasErrors('confirmPassword') ? 'confirm-password-error' : null}">
                <span id="confirm-password-error" class="auth-field-error"
                    th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                <button class="btn btn-primary" type="submit">Save New Password</button>
            </form>
        </th:block>
        <nav class="auth-links">
            <a th:href="@{/forgot-password}">Request a New Link</a>
            <a th:href="@{/login}">Back to Sign In</a>
        </nav>
    </main>
</body>

</html>
