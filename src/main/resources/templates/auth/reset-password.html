<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Đặt lại mật khẩu | RMS</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <h1>Đặt lại mật khẩu</h1>
    <p class="auth-message auth-error" role="alert" th:unless="${validToken}">Liên kết không hợp lệ, đã dùng hoặc đã hết hạn. Hãy yêu cầu liên kết mới.</p>
    <th:block th:if="${validToken}">
        <p class="auth-intro">Email đã được xác minh qua liên kết. Chọn mật khẩu mới từ 8 đến 32 ký tự.</p>
        <form th:action="@{/reset-password/{token}(token=${token})}" th:object="${form}" method="post">
            <div class="auth-message auth-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            </div>
            <label for="password">Mật khẩu mới</label>
            <input id="password" type="password" name="password" minlength="8" maxlength="32" autocomplete="new-password" required>
            <span class="auth-field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            <label for="confirm-password">Xác nhận mật khẩu mới</label>
            <input id="confirm-password" type="password" name="confirmPassword" minlength="8" maxlength="32" autocomplete="new-password" required>
            <span class="auth-field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            <button type="submit">Lưu mật khẩu mới</button>
        </form>
    </th:block>
    <nav class="auth-links">
        <a th:href="@{/forgot-password}">Yêu cầu liên kết mới</a>
        <a th:href="@{/login}">Quay lại đăng nhập</a>
    </nav>
</main>
</body>
</html>
