<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: interfaceHead('Reset Password', ~{::pageStyles})}">
  <th:block th:fragment="pageStyles"><link rel="stylesheet" th:href="@{/css/auth.css}"></th:block>
</head>
<body class="auth-page">
<a class="skip-link" href="#main">Skip to content</a>
<aside th:replace="~{fragments/auth-layout :: brandPanel}"></aside>
<main id="main" class="auth-card" tabindex="-1">
    <h1>Reset Password</h1>
    <p class="auth-message auth-error" role="alert" th:unless="${validToken}">This link is invalid, used, or expired. Request a new link.</p>
    <th:block th:if="${validToken}">
        <p class="auth-intro">Your email has been verified through this link. Choose a new password of 8–32 characters.</p>
        <form th:action="@{/reset-password/{token}(token=${token})}" th:object="${form}" method="post">
            <div th:replace="~{fragments/messages :: validationSummary}"></div>
            <label for="password">New Password <span aria-hidden="true">*</span></label>
            <input id="password" type="password" name="password" minlength="8" maxlength="32" autocomplete="new-password" required th:attr="aria-invalid=${#fields.hasErrors('password')},aria-describedby=${#fields.hasErrors('password') ? 'password-error' : null}">
            <span id="password-error" class="auth-field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            <label for="confirm-password">Confirm New Password <span aria-hidden="true">*</span></label>
            <input id="confirm-password" type="password" name="confirmPassword" minlength="8" maxlength="32" autocomplete="new-password" required th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')},aria-describedby=${#fields.hasErrors('confirmPassword') ? 'confirm-password-error' : null}">
            <span id="confirm-password-error" class="auth-field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            <button class="btn btn-primary" type="submit">Save New Password</button>
        </form>
    </th:block>
    <nav class="auth-links">
        <a th:href="@{/forgot-password}">Request a New Link</a>
        <a th:href="@{/login}">Back to Sign In</a>
    </nav>
</main>
</body>
</html>
