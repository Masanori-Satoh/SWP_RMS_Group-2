<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <th:block layout:fragment="styles">
        <!-- Trang con có thể nạp thêm styles nếu cần -->
    </th:block>
</head>
<body>
    <th:block layout:fragment="base-content">
        <!-- 1. Topbar công khai dùng chung với landing (fragments/layout/public-topbar.html) -->
        <header th:replace="~{fragments/layout/public-topbar :: topbar('jobs', false)}"></header>

        <!-- 2. Ruột trang công khai -->
        <main id="main" layout:fragment="content">
            <!-- Nội dung danh sách jobs hoặc chi tiết job -->
        </main>

        <!-- 3. Chân trang Footer Mộc (DNA) -->
        <footer th:replace="~{fragments/layout/public-footer :: footer}"></footer>
    </th:block>
</body>
</html>
