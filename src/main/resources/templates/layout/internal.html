<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <link rel="stylesheet" th:href="@{/css/workspace.css}">
    <!-- Ứng viên: không sidebar, topbar khối nổi, nền ảnh mờ (css/candidate-shell.css) -->
    <th:block th:if="${topbarUser != null and topbarUser.roleName == 'Candidate'}">
        <link rel="stylesheet" th:href="@{/css/candidate-shell.css}">
    </th:block>
    <th:block layout:fragment="styles">
        <!-- Trang con nạp thêm style riêng nếu có -->
    </th:block>
</head>

<body>
    <div layout:fragment="base-content" class="page-wrapper"
         th:with="candidateShell=${topbarUser != null and topbarUser.roleName == 'Candidate'}"
         th:classappend="${candidateShell} ? 'page-wrapper--candidate'">
        <!-- Vai trò + tên người dùng cho sidebar/topbar. Tính bằng th:with vì Thymeleaf 3.1 cấm T(...)
             trong tham số của th:replace (lỗi "access to static classes is forbidden in this context"). -->
        <th:block th:with="shellRole=${role ?: (userRole ?: (dashboard != null ? dashboard.roleName : (userProfile != null ? userProfile.roleName : (viewerRole != null ? viewerRole : (currentUser != null and currentUser instanceof T(com.group2.rms.user.entity.User) ? currentUser.role.roleName : (authenticatedUser != null ? authenticatedUser.role.roleName : (session.user != null ? session.user.role : null)))))))},
                           shellName=${fullName ?: (userName ?: (dashboard != null ? dashboard.fullName : (userProfile != null ? userProfile.fullName : (viewerName != null ? viewerName : (currentUser != null and currentUser instanceof T(com.group2.rms.user.entity.User) ? currentUser.fullName : (authenticatedUser != null ? authenticatedUser.fullName : (session.user != null ? session.user.fullName : null)))))))}">
        <!-- 1. Thanh điều hướng Sidebar thu gọn 68px/250px của Hoàng (ứng viên không có sidebar) -->
        <th:block th:unless="${candidateShell}">
        <aside th:replace="~{fragments/layout/sidebar-shell :: shell(${activeMenu ?: 'dashboard'}, ${shellRole})}">
        </aside>
        </th:block>

        <!-- 2. Vùng làm việc chính -->
        <div class="main-content">
            <!-- Topbar nội bộ & Thông tin người dùng -->
            <th:block th:unless="${candidateShell}">
            <header th:replace="~{fragments/workspace-header :: header(${shellRole}, ${shellName})}">
            </header>
            </th:block>
            <!-- Ứng viên: logo (về trang chủ), chuông, avatar, đăng xuất; không có menu -->
            <th:block th:if="${candidateShell}">
            <header th:replace="~{fragments/layout/candidate-topbar :: topbar(${activeMenu})}"></header>
            </th:block>
            <!-- Slot nội dung nghiệp vụ của từng màn hình con -->
            <main id="main" layout:fragment="content" class="page-content container">
                <!-- Ruột trang con đặt tại đây -->
            </main>
            <!-- 3. Chân trang Mộc chỉ cho ứng viên (nhân sự làm việc trong workspace, không cần footer công khai).
                 th:block vì th:replace chạy trước th:if. -->
            <th:block th:if="${candidateShell}">
                <footer th:replace="~{fragments/layout/public-footer :: footer}"></footer>
            </th:block>
        </div>
        </th:block>
    </div>
</body>

</html>
