<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <link rel="stylesheet" th:href="@{/css/workspace.css}">
    <th:block layout:fragment="styles">
        <!-- Trang con nạp thêm style riêng nếu có -->
    </th:block>
</head>

<body>
    <div layout:fragment="base-content" class="page-wrapper">
        <!-- 1. Thanh điều hướng Sidebar thu gọn 68px/250px của Hoàng -->
        <aside
            th:replace="~{fragments/layout/sidebar-shell :: shell(${activeMenu ?: 'dashboard'}, ${role ?: (userRole ?: (dashboard != null ? dashboard.roleName : (userProfile != null ? userProfile.roleName : (viewerRole != null ? viewerRole : (currentUser != null and currentUser instanceof T(com.group2.rms.user.entity.User) ? currentUser.role.roleName : (authenticatedUser != null ? authenticatedUser.role.roleName : (session.user != null ? session.user.role : null)))))))})}">
        </aside>

        <!-- 2. Vùng làm việc chính -->
        <div class="main-content">
            <!-- Topbar nội bộ & Thông tin người dùng -->
            <header
                th:replace="~{fragments/workspace-header :: header(${role ?: (userRole ?: (dashboard != null ? dashboard.roleName : (userProfile != null ? userProfile.roleName : (viewerRole != null ? viewerRole : (currentUser != null and currentUser instanceof T(com.group2.rms.user.entity.User) ? currentUser.role.roleName : (authenticatedUser != null ? authenticatedUser.role.roleName : (session.user != null ? session.user.role : null)))))))}, ${fullName ?: (userName ?: (dashboard != null ? dashboard.fullName : (userProfile != null ? userProfile.fullName : (viewerName != null ? viewerName : (currentUser != null and currentUser instanceof T(com.group2.rms.user.entity.User) ? currentUser.fullName : (authenticatedUser != null ? authenticatedUser.fullName : (session.user != null ? session.user.fullName : null)))))))})}">
            </header>
            <!-- Slot nội dung nghiệp vụ của từng màn hình con -->
            <main id="main" layout:fragment="content" class="page-content container">
                <!-- Ruột trang con đặt tại đây -->
            </main>
        </div>
    </div>
</body>

</html>
