<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/internal}">
<head>
    <title th:text="|${detail.candidate.fullName} — Ứng viên tiềm năng|">Ứng viên tiềm năng</title>
    <th:block layout:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/pages/applications.css}">
        <link rel="stylesheet" th:href="@{/css/pages/talent-pool.css}">
    </th:block>
</head>
<body>
<main id="main" layout:fragment="content" class="page-content container app-page tp-detail-page" tabindex="-1">
    <header class="card tp-profile">
        <div class="tp-profile-top">
            <nav class="app-breadcrumb tp-profile-breadcrumb" aria-label="Điều hướng">
                <a th:href="@{${backUrl}}">Ứng viên tiềm năng</a><span aria-hidden="true">/</span><span aria-current="page">Chi tiết ứng viên</span>
            </nav>
            <a class="btn btn--secondary btn--sm" th:href="@{${backUrl}}" data-pool-back>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m10 5-7 7 7 7 M3 12h18"/></svg>Quay lại danh sách
            </a>
        </div>
        <div class="tp-profile-identity">
            <span class="tp-profile-avatar" aria-hidden="true" th:with="parts=${#strings.arraySplit(detail.candidate.fullName ?: '', ' ')}"
                  th:text="${#arrays.length(parts) > 0 ? #strings.toUpperCase(#strings.substring(parts[0], 0, 1) + (#arrays.length(parts) > 1 ? #strings.substring(parts[#arrays.length(parts) - 1], 0, 1) : '')) : ''}"></span>
            <div class="tp-profile-info">
                <h1 class="page-title tp-profile-title" th:text="${detail.candidate.fullName}"></h1>
                <p class="tp-profile-contact"><a th:href="|mailto:${detail.candidate.email}|" th:text="${detail.candidate.email}"></a><span aria-hidden="true">·</span><span th:text="${detail.candidate.phoneNumber ?: 'Chưa có số điện thoại'}"></span></p>
            </div>
            <span class="badge badge--success tp-profile-badge">Ứng viên tiềm năng</span>
        </div>
    </header>

    <div th:if="${successMessage}" class="alert alert--success" role="status" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert--danger" role="alert" th:text="${errorMessage}"></div>

    <div class="tp-detail-workspace">
        <section class="card" aria-labelledby="tp-cv-history-title">
            <div class="card-header">
                <h2 id="tp-cv-history-title" class="card-title tp-workspace-title"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="7" width="13" height="13" rx="2"/><path d="M8 7V4h12v12h-3"/></svg>CV từ các lần ứng tuyển trước</h2>
            </div>
            <p th:if="${#lists.isEmpty(detail.cvs)}" class="text-muted tp-detail-empty">Chưa có CV từ lần ứng tuyển trước.</p>
            <ul th:unless="${#lists.isEmpty(detail.cvs)}" class="tp-cv-history">
                <li th:each="cv : ${detail.cvs}" class="tp-cv-entry">
                    <h3 class="tp-cv-title" th:text="${cv.jobTitle}"></h3>
                    <p class="tp-cv-date" th:if="${cv.submittedAt != null}">Đã nộp: <time th:datetime="${#temporals.formatISO(cv.submittedAt)}" th:text="${#temporals.format(cv.submittedAt, 'dd/MM/yyyy')}"></time></p>
                    <p th:if="${cv.submittedAt == null}" class="tp-cv-date">Chưa có ngày nộp</p>
                    <button type="button" class="btn btn--secondary btn--sm tp-cv-open" data-app-preview data-hide-detail-link="true" aria-haspopup="dialog" aria-controls="app-preview"
                            th:attr="aria-label=|Xem CV ${cv.jobTitle} của ${detail.candidate.fullName}|,data-name=${detail.candidate.fullName},data-job=${cv.jobTitle},data-cv-url=@{/talent-pool/{id}/cv/{appId}(id=${detail.candidate.candidateId},appId=${cv.applicationId})},data-detail-url=@{/talent-pool/{id}(id=${detail.candidate.candidateId})}">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>Xem CV
                    </button>
                </li>
            </ul>
        </section>

        <section class="card" aria-labelledby="tp-note-history-title">
            <div class="card-header">
                <h2 id="tp-note-history-title" class="card-title tp-workspace-title"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 4h16v12H9l-5 4V4Z M8 8h8 M8 12h6"/></svg>Ghi chú đánh giá nội bộ</h2>
            </div>
            <p th:if="${#lists.isEmpty(detail.notes)}" class="text-muted tp-detail-empty">Chưa có ghi chú đánh giá.</p>
            <ul th:unless="${#lists.isEmpty(detail.notes)}" class="tp-notes-feed" aria-label="Ghi chú mới nhất trước">
                <li th:each="note : ${detail.notes}" class="tp-feed-item">
                    <span class="tp-feed-avatar" aria-hidden="true" th:with="parts=${#strings.arraySplit(note.author ?: '', ' ')}"
                          th:text="${#arrays.length(parts) > 0 ? #strings.toUpperCase(#strings.substring(parts[0], 0, 1) + (#arrays.length(parts) > 1 ? #strings.substring(parts[#arrays.length(parts) - 1], 0, 1) : '')) : ''}"></span>
                    <div class="tp-feed-content">
                        <strong class="tp-feed-author" th:text="${note.author}"></strong>
                        <time class="tp-feed-time" th:datetime="${#temporals.formatISO(note.createdAt)}" th:text="${#temporals.format(note.createdAt, 'dd/MM/yyyy · HH:mm')}"></time>
                        <p class="tp-feed-body" th:text="${note.content}"></p>
                    </div>
                </li>
            </ul>
            <form class="tp-note-form" method="post" th:action="@{/talent-pool/{id}/notes(id=${detail.candidate.candidateId},jobPostingId=${jobPostingId},keyword=${filter.keyword},markedBy=${filter.markedBy},sourceJobId=${filter.sourceJobId},page=${sourcePage})}">
                <label class="form-label" for="content">Thêm ghi chú</label>
                <textarea class="form-textarea tp-note-input" id="content" name="content" rows="4" maxlength="1000" required placeholder="Nhập nhận xét của bạn…" th:text="${noteDraft}"></textarea>
                <div class="tp-note-actions"><button class="btn btn--primary btn--sm" type="submit">Lưu ghi chú</button></div>
            </form>
        </section>
    </div>
    <dialog th:replace="~{candidate/application-dialogs :: preview}"></dialog>
</main>
<th:block layout:fragment="scripts"><script th:src="@{/js/pages/applications.js}" defer></script></th:block>
</body>
</html>
